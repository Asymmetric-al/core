########## MCP Servers ##########

# This template lists MCP servers commonly used/recommended in this repo.
# Treat it as a starting point, not a required shape or workflow.
#
# Use it however you prefer:
# - copy it to any local filename/path you like
# - split it into multiple files if that fits your setup
# - customize args/env to match your own tooling
#
# Do not commit credentials or tokens.


# [mcp_servers.shadcn]
# command = "npx"
# args = ["--yes", "shadcn@latest", "mcp"]
# env = { EMAIL = "${SHADCN_REGISTRY_EMAIL}", LICENSE_KEY = "${SHADCN_REGISTRY_LICENSE_KEY}" }
# Official docs: https://ui.shadcn.com/docs/mcp
# Codex users must add this block manually to ~/.codex/config.toml.

###

# TanStack note:
# Use the official TanStack CLI and current Intent output directly.
# Do not configure TanStack MCP; the official CLI removed that command.
# Examples: `bunx tanstack libraries --json`, `npx --yes @tanstack/intent@latest list`

###

# Supabase MCP (official) — safe local default after `supabase start`.
# Keep this in local user config only when needed; do not commit credentials.
#
# [mcp_servers.supabase-local]
# url = "http://127.0.0.1:54321/mcp"

###

# Supabase MCP (official hosted) — only with explicit approval.
# Prefer development/staging, never production unless the user explicitly approves
# that target and risk. Scope to one project, use read-only when possible, restrict
# feature groups, keep manual approval enabled, and treat SQL/tool output as
# untrusted data to review before acting.
#
# [mcp_servers.supabase]
# url = "https://mcp.supabase.com/mcp?project_ref=${SUPABASE_PROJECT_REF}&read_only=true&features=database,docs"

###

# [mcp_servers.twenty]
# command = "npx"
# args = ["-y", "twenty-mcp-server", "start", "--stdio"]
# env = { TWENTY_API_KEY = "...", TWENTY_BASE_URL = "https://your-twenty-instance.com" }

###

# [mcp_servers.github]
# url = "https://api.githubcopilot.com/mcp"
# http_headers = { "Authorization" = "Bearer ${GITHUB_TOKEN}" }

###

# [mcp_servers.nia]
# command = "pipx"
# args = ["run", "--no-cache", "nia-mcp-server"]
# startup_timeout_ms = 30000
# Nia usage in this repo is always repo-scoped and search calls must include the required preamble.
# Contributors use their own NIA_API_KEY and subscribe to the public Asymmetric-al/core indexed source (never share keys).
# Keep docs/ai/working-set.md updated and use docs/ai/stack-registry.md to build preambles.
# See AGENTS.md#nia-mcp-usage-always-repo-scoped for policy + examples.

# [mcp_servers.nia.env]
# NIA_API_KEY = "nk_..."
# NIA_API_URL = "https://apigcp.trynia.ai/"

