# [mcp_servers.github]
# url = "https://api.githubcopilot.com/mcp"
# http_headers = { "Authorization" = "Bearer YOUR_GITHUB_MCP_TOKEN" }

###

# Nia MCP: prefer the remote server in user/global MCP config so repo files do
# not contain API keys. Use local pipx only if remote MCP is unavailable.
# See docs/ai/nia.md.
#
# [mcp_servers.nia]
# url = "<NIA_MCP_URL_FROM_DOCS>"
# http_headers = { "Authorization" = "Bearer YOUR_NIA_API_KEY" }
#
# Local fallback:
# [mcp_servers.nia]
# command = "pipx"
# args = ["run", "--no-cache", "nia-mcp-server"]
# startup_timeout_ms = 30000
# [mcp_servers.nia.env]
# NIA_API_KEY = "YOUR_NIA_API_KEY"
# NIA_API_URL = "<NIA_API_URL_FROM_DOCS>/"

