########## Optional personal MCP servers ##########

# The project configs (.mcp.json, .cursor/mcp.json, .codex/config.toml) already
# register next-devtools, shadcn and reui (and inngest-dev for Claude Code and
# Cursor). This file lists optional extra servers for your own user/global
# config, in Codex TOML form. Copy only what you use.
#
# Do not commit credentials or tokens.

# ReUI Pro: the project .codex/config.toml entry sets
# bearer_token_env_var = "REUI_LICENSE_KEY", so export REUI_LICENSE_KEY in the
# agent's process environment (Codex reads the variable by name;
# ${REUI_LICENSE_KEY} is not TOML interpolation). For browser OAuth instead,
# use a personal entry without bearer_token_env_var and run codex mcp login reui.
# See docs/guides/development/reui.md for registry installation and verification.

###

# [mcp_servers.tanstack]
# command = "bunx"
# args = ["@tanstack/cli", "mcp"]

###

# [mcp_servers.postgres]
# command = "docker"
# args = ["run", "-i", "--rm", "-e", "DATABASE_URI", "crystaldba/postgres-mcp", "--access-mode=restricted"]
# env = { DATABASE_URI = "postgresql://username:[REDACTED]@localhost:5432/dbname" }

###

# Twenty CRM is retired (ADR-0001). No Twenty MCP server is configured; do not add one.

###

# [mcp_servers.github]
# url = "https://api.githubcopilot.com/mcp"
# http_headers = { "Authorization" = "Bearer YOUR_GITHUB_MCP_TOKEN" }

###

# Nia remote MCP is preferred; configure it in a user/global MCP file when
# possible so API keys are never committed to this repo. See docs/ai/nia.md.
# [mcp_servers.nia]
# url = "<NIA_MCP_URL_FROM_DOCS>"
# http_headers = { "Authorization" = "Bearer YOUR_NIA_API_KEY" }

# Local fallback when remote MCP is unavailable.
# [mcp_servers.nia]
# command = "pipx"
# args = ["run", "--no-cache", "nia-mcp-server"]
# startup_timeout_ms = 30000
#
# [mcp_servers.nia.env]
# NIA_API_KEY = "YOUR_NIA_API_KEY"
# NIA_API_URL = "<NIA_API_URL_FROM_DOCS>/"

