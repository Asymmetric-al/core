# Verifies the asymmetric-al/core repository is registered as a Nia source.
# GitHub repository indexing is handled by Nia's GitHub connector, not this
# workflow. POST /v2/sources/{id}/sync is reserved for syncable source types.
name: Nia source check

on:
  push:
    branches:
      - epic
  workflow_dispatch:

jobs:
  source-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find Nia source id
        env:
          NIA_API_KEY: ${{ secrets.NIA_API_KEY }}
        run: |
          set -euo pipefail

          check_output="$(scripts/nia-source-check.sh)"
          printf '%s\n' "$check_output"
          source_id="$(printf '%s\n' "$check_output" | sed -n 's/^SOURCE_ID=//p')"

          echo "SOURCE_ID=$source_id" >> "$GITHUB_ENV"
          echo "Resolved SOURCE_ID=$source_id"

      - name: Repository source registered
        run: |
          set -euo pipefail
          echo "Nia source for this repo is registered (id=${SOURCE_ID})."
          echo "GitHub repository indexing is handled by Nia's GitHub connector."
