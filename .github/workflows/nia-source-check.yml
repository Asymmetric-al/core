# Verifies the asymmetric-al/core repository is registered as a Nia source.
# GitHub repository indexing is handled by Nia's GitHub connector, not this
# workflow. POST /v2/sources/{id}/sync is reserved for syncable source types.
name: Nia source check

on:
  push:
    branches:
      - epic
  workflow_dispatch:

jobs:
  source-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find Nia source id
        env:
          NIA_API_KEY: ${{ secrets.NIA_API_KEY }}
          NIA_API_URL: ${{ vars.NIA_API_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${NIA_API_URL:-}" ]]; then
            echo "Set repository variable NIA_API_URL to the Nia API base from the official docs." >&2
            exit 1
          fi

          api_base="${NIA_API_URL%/}"
          if [[ "$api_base" != */v2 ]]; then
            api_base="${api_base}/v2"
          fi
          response="$(curl --fail --silent --show-error --get \
            "${api_base}/sources" \
            -H "Authorization: Bearer ${NIA_API_KEY}" \
            --data-urlencode 'type=repository' \
            --data-urlencode 'query=asymmetric-al/core' \
            --data-urlencode 'limit=100')"

          source_id="$(printf '%s' "$response" | python3 scripts/nia_pick_core_source.py)"

          echo "SOURCE_ID=$source_id" >> "$GITHUB_ENV"
          echo "Resolved SOURCE_ID=$source_id"

      - name: Repository source registered
        run: |
          set -euo pipefail
          echo "Nia source for this repo is registered (id=${SOURCE_ID})."
          echo "GitHub repository indexing is handled by Nia's GitHub connector."
