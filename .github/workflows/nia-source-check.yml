# Verifies the asymmetric-al/core repository is registered as a Nia source.
# GitHub repository indexing is handled by Nia's GitHub connector, not this
# workflow. POST /v2/sources/{id}/sync is reserved for syncable source types.
name: Nia source check

on:
  push:
    branches:
      - epic
  workflow_dispatch:

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NIA_API_KEY: ${{ secrets.NIA_API_KEY }}

    steps:
      - name: Check Nia secret
        id: nia-secret
        run: |
          set -euo pipefail

          if [[ -z "${NIA_API_KEY:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nia source check skipped::NIA_API_KEY is not configured; skipping optional source registration check."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.nia-secret.outputs.configured == 'true'

      - name: Find Nia source id
        id: nia-source
        if: steps.nia-secret.outputs.configured == 'true'
        run: scripts/nia-source-check.sh

      - name: Repository source registered
        if: steps.nia-secret.outputs.configured == 'true'
        run: |
          set -euo pipefail
          echo "Nia source for this repo is registered (id=${{ steps.nia-source.outputs.source_id }})."
          echo "GitHub repository indexing is handled by Nia's GitHub connector."
