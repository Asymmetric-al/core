name: Merge coordinator

# The GitHub-side brain of the hands-off PR pipeline. On every CI completion and on a 10-minute
# schedule it evaluates each open develop PR from what the Cursor reviewers post (their
# `SEVERITY:` lines and the Safe-Fix Plan's `<!-- fix-plan blocking=N -->` marker, read from PR
# reviews by cursor[bot]) plus CI status, then either arms GitHub native auto-merge or dispatches
# the autofix workflow. See scripts/github/merge-coordinator.mjs and RERUN-AND-ACTIVATION.md.
#
# Triggers are deliberately limited to `check_suite`, `schedule`, and `workflow_dispatch` — these
# all run a workflow from the repo DEFAULT BRANCH (production). `pull_request_review` /
# `issue_comment` were removed: the former can run from a PR head branch (would fire before this
# is on production), and the latter never fires for bot reviews anyway. This file must be on
# production to fire; it still operates only on develop PRs.
#
# Secrets required: PIPELINE_PAT — fine-grained PAT (contents:write, pull-requests:write,
# actions:write to dispatch autofix) for the II-ricky-bobby-II identity, so the merge commit
# attributes correctly (passes verify:git-attribution).

on:
  check_suite:
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to evaluate"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: merge-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Evaluate open develop PRs
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.check_suite.pull_requests[0].number }}
        run: node scripts/github/merge-coordinator.mjs
