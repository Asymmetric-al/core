name: QA Smoke Preview Deploy

on:
  pull_request:
    branches: [develop]
    types: [labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to deploy for QA smoke preview"
        required: true
        type: number

permissions:
  contents: read
  packages: read
  issues: write
  pull-requests: write

env:
  BUN_VERSION: "1.4.3"
  NODE_VERSION: "24.22.3"

jobs:
  deploy:
    name: label-gated-preview-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Per pull request, cancelling a superseded run. A pull request that carries
    # a migration only plans here; preview-database below does the rest.
    concurrency:
      group: qa-smoke-preview-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    outputs:
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      carries_migration: ${{ steps.scope.outputs.carries_migration }}
      database_admin: ${{ steps.scope.outputs.database_admin }}
      database_donor: ${{ steps.scope.outputs.database_donor }}
      database_missionary: ${{ steps.scope.outputs.database_missionary }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Gate PR
        id: gate
        env:
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_LABEL_NAME: ${{ github.event.label.name || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${EVENT_PR_NUMBER}"
          else
            pr_number="${INPUT_PR_NUMBER}"
          fi

          if [[ -z "${pr_number}" ]]; then
            echo "::error::A PR number is required."
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          has_label="$(jq -r --arg label "qa:smoke" '[.labels[].name] | index($label) != null' <<<"${pr_json}")"

          skip_reason=""
          if [[ "${EVENT_NAME}" == "pull_request" && "${EVENT_ACTION}" == "labeled" && "${EVENT_LABEL_NAME}" != "qa:smoke" ]]; then
            skip_reason="different label was applied"
          elif [[ "${base_ref}" != "develop" ]]; then
            skip_reason="base branch is ${base_ref}, not develop"
          elif [[ "${draft}" == "true" ]]; then
            skip_reason="pull request is draft"
          elif [[ "${head_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            skip_reason="pull request comes from fork ${head_repo}"
          elif [[ "${has_label}" != "true" ]]; then
            skip_reason="qa:smoke label is missing"
          fi

          {
            echo "pr_number=${pr_number}"
            echo "base_ref=${base_ref}"
            echo "head_repo=${head_repo}"
            echo "head_sha=${head_sha}"
            echo "head_ref=${head_ref}"
          } >>"${GITHUB_OUTPUT}"

          if [[ -n "${skip_reason}" ]]; then
            echo "should_run=false" >>"${GITHUB_OUTPUT}"
            echo "skip_reason=${skip_reason}" >>"${GITHUB_OUTPUT}"
            echo "Skipping QA smoke preview deployment: ${skip_reason}."
            exit 0
          fi

          echo "should_run=true" >>"${GITHUB_OUTPUT}"
          echo "skip_reason=" >>"${GITHUB_OUTPUT}"

      - name: Stop after gate skip
        if: steps.gate.outputs.should_run != 'true'
        run: echo "QA smoke preview deployment skipped before checkout."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.should_run == 'true'
        with:
          ref: ${{ steps.gate.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind checked-out commit to approved PR branch
        if: steps.gate.outputs.should_run == 'true'
        env:
          PR_HEAD_REF: ${{ steps.gate.outputs.head_ref }}
          PR_HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "${PR_HEAD_REF}" >/dev/null
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          git switch --create "${PR_HEAD_REF}" "${PR_HEAD_SHA}"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve affected preview surfaces
        if: steps.gate.outputs.should_run == 'true'
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename'
          )"
          files_json="$(printf '%s\n' "${changed_files}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          scope_json="$(printf '%s' "${files_json}" | node scripts/qa/preview-smoke-scope.mjs --json)"

          # A migration in the pull request moves the whole preview onto the
          # disposable preview database (plan 7.4), in the preview-database job.
          carries_migration=false
          if grep -qE '^(supabase/migrations/|apps/admin/src/migrations/)' <<<"${changed_files}"; then
            carries_migration=true
          fi

          if [[ "${carries_migration}" == "true" ]]; then
            {
              echo "admin=false"
              echo "donor=false"
              echo "missionary=false"
              echo "any=false"
              echo "database_admin=$(jq -r '.admin' <<<"${scope_json}")"
              echo "database_donor=$(jq -r '.donor' <<<"${scope_json}")"
              echo "database_missionary=$(jq -r '.missionary' <<<"${scope_json}")"
            } >>"${GITHUB_OUTPUT}"
          else
            {
              echo "admin=$(jq -r '.admin' <<<"${scope_json}")"
              echo "donor=$(jq -r '.donor' <<<"${scope_json}")"
              echo "missionary=$(jq -r '.missionary' <<<"${scope_json}")"
              echo "any=$(jq -r '.any' <<<"${scope_json}")"
            } >>"${GITHUB_OUTPUT}"
          fi
          {
            echo "carries_migration=${carries_migration}"
            echo "scope=$(jq -r '.scope' <<<"${scope_json}")"
          } >>"${GITHUB_OUTPUT}"

          echo "QA smoke preview scope: $(jq -r '.scope' <<<"${scope_json}"); carries a migration: ${carries_migration}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.any == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Mask deployment secrets
        if: steps.scope.outputs.any == 'true'
        env:
          CLAUDE_QA_ROUTINE_WEBHOOK_URL: ${{ secrets.CLAUDE_QA_ROUTINE_WEBHOOK_URL }}
          QA_TEST_EMAIL: ${{ secrets.QA_PREVIEW_TEST_EMAIL && secrets.QA_PREVIEW_TEST_PASSWORD && secrets.QA_PREVIEW_TEST_EMAIL || secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_PREVIEW_TEST_EMAIL && secrets.QA_PREVIEW_TEST_PASSWORD && secrets.QA_PREVIEW_TEST_PASSWORD || secrets.QA_TEST_PASSWORD }}
          VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET }}
          VERCEL_ADMIN_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_DONOR_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_DONOR_AUTOMATION_BYPASS_SECRET }}
          VERCEL_DONOR_PROJECT_ID: ${{ secrets.VERCEL_DONOR_PROJECT_ID }}
          VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET }}
          VERCEL_MISSIONARY_PROJECT_ID: ${{ secrets.VERCEL_MISSIONARY_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          for value in \
            "${VERCEL_TOKEN:-}" \
            "${VERCEL_ORG_ID:-}" \
            "${VERCEL_ADMIN_PROJECT_ID:-}" \
            "${VERCEL_DONOR_PROJECT_ID:-}" \
            "${VERCEL_MISSIONARY_PROJECT_ID:-}" \
            "${QA_TEST_EMAIL:-}" \
            "${QA_TEST_PASSWORD:-}" \
            "${VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET:-}" \
            "${VERCEL_DONOR_AUTOMATION_BYPASS_SECRET:-}" \
            "${VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET:-}" \
            "${CLAUDE_QA_ROUTINE_WEBHOOK_URL:-}"; do
            if [[ -n "${value}" ]]; then
              echo "::add-mask::${value}"
            fi
          done

      - name: Validate required preview smoke secrets
        if: steps.scope.outputs.any == 'true'
        env:
          QA_PREVIEW_CREDENTIALS_PARTIAL: ${{ (secrets.QA_PREVIEW_TEST_EMAIL != '' && secrets.QA_PREVIEW_TEST_PASSWORD == '') || (secrets.QA_PREVIEW_TEST_EMAIL == '' && secrets.QA_PREVIEW_TEST_PASSWORD != '') }}
          ADMIN_AFFECTED: ${{ steps.scope.outputs.admin }}
          DONOR_AFFECTED: ${{ steps.scope.outputs.donor }}
          MISSIONARY_AFFECTED: ${{ steps.scope.outputs.missionary }}
          QA_TEST_EMAIL: ${{ secrets.QA_PREVIEW_TEST_EMAIL && secrets.QA_PREVIEW_TEST_PASSWORD && secrets.QA_PREVIEW_TEST_EMAIL || secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_PREVIEW_TEST_EMAIL && secrets.QA_PREVIEW_TEST_PASSWORD && secrets.QA_PREVIEW_TEST_PASSWORD || secrets.QA_TEST_PASSWORD }}
          VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET }}
          VERCEL_ADMIN_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_DONOR_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_DONOR_AUTOMATION_BYPASS_SECRET }}
          VERCEL_DONOR_PROJECT_ID: ${{ secrets.VERCEL_DONOR_PROJECT_ID }}
          VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET }}
          VERCEL_MISSIONARY_PROJECT_ID: ${{ secrets.VERCEL_MISSIONARY_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${QA_PREVIEW_CREDENTIALS_PARTIAL}" == "true" ]]; then
            echo "::error::Both QA_PREVIEW_TEST_EMAIL and QA_PREVIEW_TEST_PASSWORD must be configured together."
            exit 1
          fi

          missing=()

          require_secret() {
            local name="$1"
            local value="$2"

            if [[ -z "${value}" ]]; then
              missing+=("${name}")
            fi
          }

          require_secret "QA_TEST_EMAIL" "${QA_TEST_EMAIL:-}"
          require_secret "QA_TEST_PASSWORD" "${QA_TEST_PASSWORD:-}"
          require_secret "VERCEL_TOKEN" "${VERCEL_TOKEN:-}"
          require_secret "VERCEL_ORG_ID" "${VERCEL_ORG_ID:-}"

          if [[ "${ADMIN_AFFECTED}" == "true" ]]; then
            require_secret "VERCEL_ADMIN_PROJECT_ID" "${VERCEL_ADMIN_PROJECT_ID:-}"
            require_secret "VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET" "${VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET:-}"
          fi

          if [[ "${DONOR_AFFECTED}" == "true" ]]; then
            require_secret "VERCEL_DONOR_PROJECT_ID" "${VERCEL_DONOR_PROJECT_ID:-}"
            require_secret "VERCEL_DONOR_AUTOMATION_BYPASS_SECRET" "${VERCEL_DONOR_AUTOMATION_BYPASS_SECRET:-}"
          fi

          if [[ "${MISSIONARY_AFFECTED}" == "true" ]]; then
            require_secret "VERCEL_MISSIONARY_PROJECT_ID" "${VERCEL_MISSIONARY_PROJECT_ID:-}"
            require_secret "VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET" "${VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET:-}"
          fi

          if [[ "${#missing[@]}" -gt 0 ]]; then
            for name in "${missing[@]}"; do
              echo "::error::Missing required GitHub Actions secret: ${name}"
            done
            exit 1
          fi

      - name: Deploy admin preview
        if: steps.scope.outputs.admin == 'true'
        id: deploy_admin
        env:
          CORE_PREVIEW_GIT_BRANCH: ${{ steps.gate.outputs.head_ref }}
          CORE_PREVIEW_GIT_SHA: ${{ steps.gate.outputs.head_sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/qa/deploy-hosted-preview.mjs admin

      - name: Deploy donor preview
        if: steps.scope.outputs.donor == 'true'
        id: deploy_donor
        env:
          CORE_PREVIEW_GIT_BRANCH: ${{ steps.gate.outputs.head_ref }}
          CORE_PREVIEW_GIT_SHA: ${{ steps.gate.outputs.head_sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DONOR_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/qa/deploy-hosted-preview.mjs donor

      - name: Deploy missionary preview
        if: steps.scope.outputs.missionary == 'true'
        id: deploy_missionary
        env:
          CORE_PREVIEW_GIT_BRANCH: ${{ steps.gate.outputs.head_ref }}
          CORE_PREVIEW_GIT_SHA: ${{ steps.gate.outputs.head_sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MISSIONARY_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/qa/deploy-hosted-preview.mjs missionary

      - name: Comment preview URLs
        if: steps.gate.outputs.should_run == 'true' && steps.scope.outputs.carries_migration != 'true'
        env:
          ADMIN_URL: ${{ steps.deploy_admin.outputs.url }}
          DONOR_URL: ${{ steps.deploy_donor.outputs.url }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          MISSIONARY_URL: ${{ steps.deploy_missionary.outputs.url }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        shell: bash
        run: |
          set -euo pipefail

          admin_display="${ADMIN_URL:-skipped}"
          donor_display="${DONOR_URL:-skipped}"
          missionary_display="${MISSIONARY_URL:-skipped}"
          marker_json="$(
            jq -nc \
              --arg sha "${HEAD_SHA}" \
              --arg admin "${ADMIN_URL:-}" \
              --arg donor "${DONOR_URL:-}" \
              --arg missionary "${MISSIONARY_URL:-}" \
              '{
                sha: $sha,
                admin: (if $admin == "" then null else $admin end),
                donor: (if $donor == "" then null else $donor end),
                missionary: (if $missionary == "" then null else $missionary end)
              }'
          )"

          body_file="${RUNNER_TEMP}/qa-smoke-preview-comment.md"
          cat >"${body_file}" <<EOF
          # QA Smoke Preview Deployments

          Label: qa:smoke
          Commit: ${HEAD_SHA}
          Scope: ${SCOPE}

          Preview URLs:
          - Admin: ${admin_display}
          - Donor: ${donor_display}
          - Missionary: ${missionary_display}

          <!-- qa-smoke-preview-ready
          ${marker_json}
          -->
          EOF

          if [[ "${SCOPE}" == "none" ]]; then
            cat >>"${body_file}" <<EOF

          No affected smoke surface was detected; no Vercel preview deployment was created.
          EOF
          fi

          existing_comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | contains("<!-- qa-smoke-preview-ready")) | .id' \
              | tail -n 1
          )"

          if [[ -n "${existing_comment_id}" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
              --field "body=$(cat "${body_file}")" >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --field "body=$(cat "${body_file}")" >/dev/null
          fi

      - name: Install Playwright smoke dependencies
        if: steps.scope.outputs.any == 'true'
        id: smoke_deps
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/github/install-canvas-deps.sh
          bun ci --no-cache --backend=copyfile
          bunx playwright install --with-deps chromium

      - name: Run headless preview smoke QA
        if: steps.gate.outputs.should_run == 'true' && steps.scope.outputs.carries_migration != 'true'
        id: smoke
        env:
          ADMIN_URL: ${{ steps.deploy_admin.outputs.url }}
          DEPS_OUTCOME: ${{ steps.smoke_deps.outcome || '' }}
          DONOR_URL: ${{ steps.deploy_donor.outputs.url }}
          MISSIONARY_URL: ${{ steps.deploy_missionary.outputs.url }}
          QA_ADMIN_BASE_URL: ${{ steps.deploy_admin.outputs.url }}
          QA_DONOR_BASE_URL: ${{ steps.deploy_donor.outputs.url }}
          QA_MISSIONARY_BASE_URL: ${{ steps.deploy_missionary.outputs.url }}
          QA_TEST_EMAIL: ${{ secrets.QA_PREVIEW_TEST_EMAIL && secrets.QA_PREVIEW_TEST_PASSWORD && secrets.QA_PREVIEW_TEST_EMAIL || secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_PREVIEW_TEST_EMAIL && secrets.QA_PREVIEW_TEST_PASSWORD && secrets.QA_PREVIEW_TEST_PASSWORD || secrets.QA_TEST_PASSWORD }}
          VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET }}
          VERCEL_DONOR_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_DONOR_AUTOMATION_BYPASS_SECRET }}
          VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          admin_status="SKIPPED"
          donor_status="SKIPPED"
          missionary_status="SKIPPED"
          result="SKIPPED"
          evidence="No affected smoke surface was detected; no Playwright preview smoke projects were run."

          if [[ "${DEPS_OUTCOME}" == "failure" ]]; then
            [[ -n "${ADMIN_URL:-}" ]] && admin_status="FAIL"
            [[ -n "${DONOR_URL:-}" ]] && donor_status="FAIL"
            [[ -n "${MISSIONARY_URL:-}" ]] && missionary_status="FAIL"
            result="FAIL"
            evidence="Playwright dependency/browser installation failed before smoke tests could run."

            {
              echo "result=${result}"
              echo "admin=${admin_status}"
              echo "donor=${donor_status}"
              echo "missionary=${missionary_status}"
              echo "evidence=${evidence}"
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          run_project() {
            local status_var="$1"
            local surface="$2"
            local project="$3"
            local base_url="$4"

            if [[ -z "${base_url}" ]]; then
              return 0
            fi

            local report_dir="playwright-report/pr-preview-smoke-${surface}"
            local output_dir="test-results/pr-preview-smoke-${surface}"

            echo "Running ${project} preview smoke."
            set +e
            PLAYWRIGHT_REPORT_DIR="${report_dir}" \
              PLAYWRIGHT_OUTPUT_DIR="${output_dir}" \
              E2E_ADMIN_EMAIL="${QA_TEST_EMAIL:-}" \
              E2E_ADMIN_PASSWORD="${QA_TEST_PASSWORD:-}" \
              E2E_DONOR_EMAIL="${QA_TEST_EMAIL:-}" \
              E2E_DONOR_PASSWORD="${QA_TEST_PASSWORD:-}" \
              E2E_MISSIONARY_EMAIL="${QA_TEST_EMAIL:-}" \
              E2E_MISSIONARY_PASSWORD="${QA_TEST_PASSWORD:-}" \
              DEMO_ADMIN_EMAIL="${QA_TEST_EMAIL:-}" \
              DEMO_DONOR_EMAIL="${QA_TEST_EMAIL:-}" \
              DEMO_MISSIONARY_EMAIL="${QA_TEST_EMAIL:-}" \
              DEMO_PASSWORD="${QA_TEST_PASSWORD:-}" \
              node node_modules/@playwright/test/cli.js test \
                -c playwright.development-smoke.config.ts \
                --project="${project}"
            local exit_code="$?"
            set -e

            if [[ "${exit_code}" -eq 0 ]]; then
              printf -v "${status_var}" "PASS"
            else
              printf -v "${status_var}" "FAIL"
              result="FAIL"
            fi
          }

          if [[ -n "${ADMIN_URL:-}" || -n "${DONOR_URL:-}" || -n "${MISSIONARY_URL:-}" ]]; then
            result="PASS"
            evidence="Selected Playwright preview smoke projects passed."
          fi

          run_project admin_status "admin" "development-admin" "${ADMIN_URL:-}"
          run_project donor_status "donor" "development-donor" "${DONOR_URL:-}"
          run_project missionary_status "missionary" "development-missionary" "${MISSIONARY_URL:-}"

          if [[ "${result}" == "FAIL" ]]; then
            evidence="Sanitized diagnostics: playwright-report/pr-preview-smoke-*/sanitized/{index.html,results.json}. See the artifact-upload step for availability; raw test outputs are excluded."
          fi

          {
            echo "result=${result}"
            echo "admin=${admin_status}"
            echo "donor=${donor_status}"
            echo "missionary=${missionary_status}"
            echo "evidence=${evidence}"
          } >>"${GITHUB_OUTPUT}"

      - name: Upload Playwright smoke artifacts
        if: steps.smoke.outputs.result == 'FAIL'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-preview-smoke-playwright-artifacts
          path: |
            playwright-report/pr-preview-smoke-*/sanitized/index.html
            playwright-report/pr-preview-smoke-*/sanitized/results.json
          if-no-files-found: error
          retention-days: 7

      - name: Comment headless smoke QA result
        if: always() && steps.gate.outputs.should_run == 'true' && steps.scope.outputs.carries_migration != 'true'
        env:
          ADMIN_STATUS: ${{ steps.smoke.outputs.admin }}
          ADMIN_URL: ${{ steps.deploy_admin.outputs.url }}
          DONOR_STATUS: ${{ steps.smoke.outputs.donor }}
          DONOR_URL: ${{ steps.deploy_donor.outputs.url }}
          EVIDENCE: ${{ steps.smoke.outputs.evidence }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          MISSIONARY_STATUS: ${{ steps.smoke.outputs.missionary }}
          MISSIONARY_URL: ${{ steps.deploy_missionary.outputs.url }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          RESULT: ${{ steps.smoke.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail

          admin_display="${ADMIN_URL:-skipped}"
          donor_display="${DONOR_URL:-skipped}"
          missionary_display="${MISSIONARY_URL:-skipped}"

          body_file="${RUNNER_TEMP}/headless-pr-preview-smoke-qa.md"
          cat >"${body_file}" <<EOF
          # Headless PR Preview Smoke QA

          ## Result
          ${RESULT}

          ## Trigger
          qa:smoke

          ## Commit
          ${HEAD_SHA}

          ## Preview URLs
          - Admin: ${admin_display}
          - Donor: ${donor_display}
          - Missionary: ${missionary_display}

          ## Projects
          - development-admin: ${ADMIN_STATUS:-SKIPPED}
          - development-donor: ${DONOR_STATUS:-SKIPPED}
          - development-missionary: ${MISSIONARY_STATUS:-SKIPPED}

          ## Evidence
          ${EVIDENCE}

          ## Notes
          No secrets were printed. No credentials were printed. No production deploys were run.

          <!-- headless-pr-preview-smoke-qa -->
          EOF

          existing_comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | contains("<!-- headless-pr-preview-smoke-qa -->")) | .id' \
              | tail -n 1
          )"

          if [[ -n "${existing_comment_id}" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
              --field "body=$(cat "${body_file}")" >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --field "body=$(cat "${body_file}")" >/dev/null
          fi

      - name: Notify Claude QA routine
        if: steps.scope.outputs.any == 'true'
        env:
          ADMIN_URL: ${{ steps.deploy_admin.outputs.url }}
          CLAUDE_QA_ROUTINE_WEBHOOK_URL: ${{ secrets.CLAUDE_QA_ROUTINE_WEBHOOK_URL }}
          DONOR_URL: ${{ steps.deploy_donor.outputs.url }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          MISSIONARY_URL: ${{ steps.deploy_missionary.outputs.url }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLAUDE_QA_ROUTINE_WEBHOOK_URL:-}" ]]; then
            echo "Claude QA routine webhook is not configured; skipping handoff."
            exit 0
          fi

          payload="$(
            jq -nc \
              --argjson pr_number "${PR_NUMBER}" \
              --arg sha "${HEAD_SHA}" \
              --arg admin "${ADMIN_URL:-}" \
              --arg donor "${DONOR_URL:-}" \
              --arg missionary "${MISSIONARY_URL:-}" \
              '{
                event: "qa_smoke_preview_ready",
                repo: "Asymmetric-al/core",
                pr_number: $pr_number,
                sha: $sha,
                base: "develop",
                label: "qa:smoke",
                urls: {
                  admin: (if $admin == "" then null else $admin end),
                  donor: (if $donor == "" then null else $donor end),
                  missionary: (if $missionary == "" then null else $missionary end)
                }
              }'
          )"

          if ! curl --fail --silent --output /dev/null \
            --header "Content-Type: application/json" \
            --request POST \
            --data "${payload}" \
            "${CLAUDE_QA_ROUTINE_WEBHOOK_URL}"; then
            echo "::warning::Claude QA routine webhook call failed; continuing."
          fi

      - name: Fail after smoke QA failure
        if: steps.smoke.outputs.result == 'FAIL'
        shell: bash
        run: |
          echo "::error::Headless PR preview smoke QA failed."
          exit 1

  # A pull request that carries a migration (plan 7.4): rebuild the disposable
  # preview Supabase project from this head, deploy into the Vercel custom
  # environment wired to it, check each deployment reads that project, and
  # smoke it, as one job in one repository-wide group that never cancels. The
  # next pull request's rebuild waits until this smoke run ends. Development
  # is never touched: the job holds only the preview project's credentials,
  # and the scripts refuse the development project.
  preview-database:
    name: preview-database-smoke
    needs: deploy
    if: needs.deploy.outputs.carries_migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release-preview
    concurrency:
      group: preview-database
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_ENVIRONMENT: preview
      RELEASE_SUPABASE_PROJECT_REF: ${{ vars.RELEASE_SUPABASE_PROJECT_REF }}
      REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/release_replay
      PREVIEW_APPS: >-
        ${{ needs.deploy.outputs.database_admin == 'true' && 'admin' || '' }}
        ${{ needs.deploy.outputs.database_donor == 'true' && 'donor' || '' }}
        ${{ needs.deploy.outputs.database_missionary == 'true' && 'missionary' || '' }}
    services:
      postgres:
        image: ghcr.io/asymmetric-al/core-ci-postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: release_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind checked-out commit to approved PR branch
        env:
          PR_HEAD_REF: ${{ needs.deploy.outputs.head_ref }}
          PR_HEAD_SHA: ${{ needs.deploy.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "${PR_HEAD_REF}" >/dev/null
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          git switch --create "${PR_HEAD_REF}" "${PR_HEAD_SHA}"

      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun ci --no-cache --backend=copyfile
      - name: Install PostgreSQL client
        run: bash scripts/github/install-postgresql-client.sh
      # One pin for the repository: the version scripts/supabase-cli.mjs pins.
      # The preview rebuild runs only this installed CLI and never fetches one:
      # npx inside the repository stops on the root package.json's overrides.
      - name: Read the pinned Supabase CLI version
        id: supabase-pin
        run: |
          version="$(sed -n 's/^const PINNED_SUPABASE_CLI_VERSION = "\([0-9.]*\)";$/\1/p' scripts/supabase-cli.mjs)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ steps.supabase-pin.outputs.version }}

      # Hosted Supabase gives `postgres` default privileges in `public` before
      # any migration runs; the replay applies the same ones first, or its
      # access lists never equal the target's and the fingerprint gate stops
      # every hosted release (WP1.6; scripts/sql/hosted-default-privileges.sql).
      - name: Replay every migration on a fresh database
        env:
          DATABASE_URL: ${{ env.REPLAY_DATABASE_URL }}
        run: node scripts/verify/supabase-migrations.mjs --hosted-defaults
      - name: Replay Payload migrations on the fresh database
        env:
          PAYLOAD_DATABASE_URI: ${{ env.REPLAY_DATABASE_URL }}
          PAYLOAD_SECRET: release-replay-payload-secret # pragma: allowlist secret
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
        run: bun run cms:migrate
      - name: Fingerprint the replay
        run: >-
          node scripts/release/schema-fingerprint.mjs capture
          --database-url-env REPLAY_DATABASE_URL
          --out "$RUNNER_TEMP/replay-fingerprint.json"

      - name: Rebuild the preview database from this head
        env:
          RELEASE_DATABASE_URL: ${{ secrets.RELEASE_DATABASE_URL }}
          RELEASE_CMS_OWNER_PASSWORD: ${{ secrets.RELEASE_CMS_OWNER_PASSWORD }}
          RELEASE_CMS_RUNTIME_PASSWORD: ${{ secrets.RELEASE_CMS_RUNTIME_PASSWORD }}
          RELEASE_DATABASE_SSL_CA: ${{ secrets.RELEASE_DATABASE_SSL_CA }}
          RELEASE_SEED_LOGIN_PASSWORD: ${{ secrets.RELEASE_SEED_LOGIN_PASSWORD }}
        run: node scripts/release/release-database.mjs preview-rebuild
      - name: Catalog gates and schema fingerprint against the replay
        env:
          RELEASE_DATABASE_URL: ${{ secrets.RELEASE_DATABASE_URL }}
          RELEASE_DATABASE_SSL_CA: ${{ secrets.RELEASE_DATABASE_SSL_CA }}
          RELEASE_REPLAY_FINGERPRINT: ${{ runner.temp }}/replay-fingerprint.json
        run: node scripts/release/release-database.mjs gates
      - name: Record the expected migration heads
        env:
          RELEASE_DATABASE_URL: ${{ secrets.RELEASE_DATABASE_URL }}
          RELEASE_DATABASE_SSL_CA: ${{ secrets.RELEASE_DATABASE_SSL_CA }}
        run: node scripts/release/release-database.mjs record-heads

      - name: Deploy previews on the preview database and check each reads it
        id: deploy_database
        env:
          CORE_PREVIEW_CUSTOM_ENVIRONMENT: preview-database
          CORE_PREVIEW_GIT_BRANCH: ${{ needs.deploy.outputs.head_ref }}
          CORE_PREVIEW_GIT_SHA: ${{ needs.deploy.outputs.head_sha }}
          RELEASE_SHA: ${{ needs.deploy.outputs.head_sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ADMIN_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_DONOR_PROJECT_ID: ${{ secrets.VERCEL_DONOR_PROJECT_ID }}
          VERCEL_MISSIONARY_PROJECT_ID: ${{ secrets.VERCEL_MISSIONARY_PROJECT_ID }}
          VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET }}
          VERCEL_DONOR_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_DONOR_AUTOMATION_BYPASS_SECRET }}
          VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for app in ${PREVIEW_APPS}; do
            project_var="VERCEL_${app^^}_PROJECT_ID"
            out="${RUNNER_TEMP}/preview-${app}.out"
            : >"${out}"
            GITHUB_OUTPUT="${out}" VERCEL_PROJECT_ID="${!project_var}" \
              node scripts/qa/deploy-hosted-preview.mjs "${app}"
            url="$(sed -n 's/^url=//p' "${out}")"
            # The smoke runs only against a deployment that reads the preview
            # project at the migrated heads.
            node scripts/release/vercel-release.mjs check --app "${app}" --url "${url}"
            echo "${app}=${url}" >>"${GITHUB_OUTPUT}"
          done

      - name: Install Playwright smoke dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run headless preview smoke QA on the preview database
        id: smoke_database
        env:
          QA_ADMIN_BASE_URL: ${{ steps.deploy_database.outputs.admin }}
          QA_DONOR_BASE_URL: ${{ steps.deploy_database.outputs.donor }}
          QA_MISSIONARY_BASE_URL: ${{ steps.deploy_database.outputs.missionary }}
          QA_TEST_EMAIL: ${{ secrets.QA_PREVIEW_TEST_EMAIL && secrets.QA_PREVIEW_TEST_PASSWORD && secrets.QA_PREVIEW_TEST_EMAIL || secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_PREVIEW_TEST_EMAIL && secrets.QA_PREVIEW_TEST_PASSWORD && secrets.QA_PREVIEW_TEST_PASSWORD || secrets.QA_TEST_PASSWORD }}
          VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET }}
          VERCEL_DONOR_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_DONOR_AUTOMATION_BYPASS_SECRET }}
          VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_MISSIONARY_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          result="PASS"
          for app in ${PREVIEW_APPS}; do
            set +e
            PLAYWRIGHT_REPORT_DIR="playwright-report/pr-preview-smoke-${app}" \
              PLAYWRIGHT_OUTPUT_DIR="test-results/pr-preview-smoke-${app}" \
              E2E_ADMIN_EMAIL="${QA_TEST_EMAIL:-}" E2E_ADMIN_PASSWORD="${QA_TEST_PASSWORD:-}" \
              E2E_DONOR_EMAIL="${QA_TEST_EMAIL:-}" E2E_DONOR_PASSWORD="${QA_TEST_PASSWORD:-}" \
              E2E_MISSIONARY_EMAIL="${QA_TEST_EMAIL:-}" E2E_MISSIONARY_PASSWORD="${QA_TEST_PASSWORD:-}" \
              DEMO_ADMIN_EMAIL="${QA_TEST_EMAIL:-}" DEMO_DONOR_EMAIL="${QA_TEST_EMAIL:-}" \
              DEMO_MISSIONARY_EMAIL="${QA_TEST_EMAIL:-}" DEMO_PASSWORD="${QA_TEST_PASSWORD:-}" \
              node node_modules/@playwright/test/cli.js test \
                -c playwright.development-smoke.config.ts \
                --project="development-${app}"
            status="$?"
            set -e
            if [[ "${status}" -ne 0 ]]; then
              result="FAIL"
            fi
          done
          echo "result=${result}" >>"${GITHUB_OUTPUT}"
          [[ "${result}" == "PASS" ]]

      - name: Comment preview database smoke result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.deploy.outputs.head_sha }}
          PR_NUMBER: ${{ needs.deploy.outputs.pr_number }}
          PROJECT_REF: ${{ vars.RELEASE_SUPABASE_PROJECT_REF }}
          RESULT: ${{ steps.smoke_database.outputs.result || 'NOT RUN' }}
          ADMIN_URL: ${{ steps.deploy_database.outputs.admin }}
          DONOR_URL: ${{ steps.deploy_database.outputs.donor }}
          MISSIONARY_URL: ${{ steps.deploy_database.outputs.missionary }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/preview-database-smoke.md"
          cat >"${body_file}" <<BODY
          # Preview Database Smoke QA

          This pull request carries a migration, so its preview ran on the
          disposable preview Supabase project, rebuilt from this head.

          Result: ${RESULT}
          Commit: ${HEAD_SHA}
          Preview project: ${PROJECT_REF}

          - Admin: ${ADMIN_URL:-skipped}
          - Donor: ${DONOR_URL:-skipped}
          - Missionary: ${MISSIONARY_URL:-skipped}

          No secrets were printed. Development was not touched.

          <!-- preview-database-smoke -->
          BODY
          existing="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | contains("<!-- preview-database-smoke -->")) | .id' \
              | tail -n 1
          )"
          if [[ -n "${existing}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              --field "body=$(cat "${body_file}")" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --field "body=$(cat "${body_file}")" >/dev/null
          fi
