          export WP5_IDENTITY_IT_ANON_KEY WP5_IDENTITY_IT_SERVICE_KEY
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2678/own-donor-reads.postgrest.acceptance.test.ts
      - name: Verify the CRM's notes and relationships page exactly through PostgREST
        shell: bash
        env:
          WP5_IDENTITY_IT_URL: http://127.0.0.1:54321
          WP5_IDENTITY_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
