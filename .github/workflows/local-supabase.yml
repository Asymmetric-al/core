permissions:
  contents: read
  packages: read

env:
  BUN_VERSION: "1.4.3"
  NODE_VERSION: "24.22.3"

concurrency:
  group: local-supabase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/release_replay
    # The plain Postgres the release job replays on (release.yml); the stack's
    # own database listens on 54322.
    services:
      postgres:
        image: ghcr.io/asymmetric-al/core-ci-postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: release_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Reject fork pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork PRs need a maintainer to run CI"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun ci --no-cache --backend=copyfile
      # One pin for the repository: the version scripts/supabase-cli.mjs pins.
      # With it installed, the wrapper runs it rather than its npx fallback.
      - name: Read the pinned Supabase CLI version
        id: supabase-pin
        run: |
          version="$(sed -n 's/^const PINNED_SUPABASE_CLI_VERSION = "\([0-9.]*\)";$/\1/p' scripts/supabase-cli.mjs)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ steps.supabase-pin.outputs.version }}
      # Applies every migration and the seed to a real Supabase stack (roles,
      # Auth, PostgREST, Mailpit), which CI's plain Postgres does not have.
      - name: Start the local Supabase stack
        id: stack
        run: >-
          bun run supabase -- start
          -x studio,edge-runtime,logflare,vector,imgproxy,postgres-meta,supavisor
      # The release job's replay, made as it makes it, must fingerprint exactly
      # as the stack does, before the round trips write to the stack.
      - name: Install PostgreSQL client
        run: bash scripts/github/install-postgresql-client.sh
      - name: Replay every migration on plain Postgres, as the release job does
        env:
          DATABASE_URL: ${{ env.REPLAY_DATABASE_URL }}
        run: node scripts/verify/supabase-migrations.mjs --hosted-defaults
      - name: The replay fingerprints exactly as the stack does
        env:
          STACK_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          node scripts/release/schema-fingerprint.mjs capture --database-url-env REPLAY_DATABASE_URL --out "$RUNNER_TEMP/replay-fingerprint.json"
          node scripts/release/schema-fingerprint.mjs capture --database-url-env STACK_DATABASE_URL --out "$RUNNER_TEMP/stack-fingerprint.json"
          node scripts/release/schema-fingerprint.mjs compare "$RUNNER_TEMP/replay-fingerprint.json" "$RUNNER_TEMP/stack-fingerprint.json"
      - name: Verify missionary handler authority through PostgREST
        shell: bash
        env:
          MISSIONARY_IT_SUPABASE_URL: http://127.0.0.1:54321
          MISSIONARY_IT_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          export MISSIONARY_IT_SERVICE_ROLE_KEY
          MISSIONARY_IT_SERVICE_ROLE_KEY="$(bun run supabase -- status -o json | node -e 'const status = JSON.parse(require("node:fs").readFileSync(0)); if (!status.SERVICE_ROLE_KEY) process.exit(1); process.stdout.write(status.SERVICE_ROLE_KEY)')"
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2675/missionary-handler-authority.postgrest.acceptance.test.ts
      - name: Verify tenant records through PostgREST
        shell: bash
        env:
          WP3_TENANT_IT_URL: http://127.0.0.1:54321
          WP3_TENANT_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status="$(bun run supabase -- status -o json)"
          WP3_TENANT_IT_ANON_KEY="$(jq -er '.ANON_KEY | select(length > 0)' <<< "$status")"
          WP3_TENANT_IT_SERVICE_KEY="$(jq -er '.SERVICE_ROLE_KEY | select(length > 0)' <<< "$status")"
          export WP3_TENANT_IT_ANON_KEY WP3_TENANT_IT_SERVICE_KEY
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2676/tenant-records.postgrest.acceptance.test.ts
      - name: Verify Sites, claimed names and the home record through PostgREST
        shell: bash
        env:
          WP3_TENANT_IT_URL: http://127.0.0.1:54321
          WP3_TENANT_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status="$(bun run supabase -- status -o json)"
          WP3_TENANT_IT_ANON_KEY="$(jq -er '.ANON_KEY | select(length > 0)' <<< "$status")"
          WP3_TENANT_IT_SERVICE_KEY="$(jq -er '.SERVICE_ROLE_KEY | select(length > 0)' <<< "$status")"
          export WP3_TENANT_IT_ANON_KEY WP3_TENANT_IT_SERVICE_KEY
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2676/sites.postgrest.acceptance.test.ts
      - name: Verify identity keys through PostgREST
        shell: bash
        env:
          WP5_IDENTITY_IT_URL: http://127.0.0.1:54321
          WP5_IDENTITY_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status="$(bun run supabase -- status -o json)"
          WP5_IDENTITY_IT_ANON_KEY="$(jq -er '.ANON_KEY | select(length > 0)' <<< "$status")"
          WP5_IDENTITY_IT_SERVICE_KEY="$(jq -er '.SERVICE_ROLE_KEY | select(length > 0)' <<< "$status")"
          export WP5_IDENTITY_IT_ANON_KEY WP5_IDENTITY_IT_SERVICE_KEY
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2678/identity-keys.postgrest.acceptance.test.ts
      - name: Verify worker names through PostgREST
        shell: bash
        env:
          WP5_IDENTITY_IT_URL: http://127.0.0.1:54321
          WP5_IDENTITY_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status="$(bun run supabase -- status -o json)"
          WP5_IDENTITY_IT_ANON_KEY="$(jq -er '.ANON_KEY | select(length > 0)' <<< "$status")"
          WP5_IDENTITY_IT_SERVICE_KEY="$(jq -er '.SERVICE_ROLE_KEY | select(length > 0)' <<< "$status")"
          export WP5_IDENTITY_IT_ANON_KEY WP5_IDENTITY_IT_SERVICE_KEY
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2678/worker-names.postgrest.acceptance.test.ts
      - name: Verify supporter names through PostgREST
        shell: bash
        env:
          WP5_IDENTITY_IT_URL: http://127.0.0.1:54321
          WP5_IDENTITY_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status="$(bun run supabase -- status -o json)"
          WP5_IDENTITY_IT_ANON_KEY="$(jq -er '.ANON_KEY | select(length > 0)' <<< "$status")"
          WP5_IDENTITY_IT_SERVICE_KEY="$(jq -er '.SERVICE_ROLE_KEY | select(length > 0)' <<< "$status")"
          export WP5_IDENTITY_IT_ANON_KEY WP5_IDENTITY_IT_SERVICE_KEY
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2678/supporter-names.postgrest.acceptance.test.ts
      - name: Verify assignment keys and the CRM's record owner through PostgREST
        shell: bash
        env:
          WP5_IDENTITY_IT_URL: http://127.0.0.1:54321
          WP5_IDENTITY_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status="$(bun run supabase -- status -o json)"
          WP5_IDENTITY_IT_ANON_KEY="$(jq -er '.ANON_KEY | select(length > 0)' <<< "$status")"
          WP5_IDENTITY_IT_SERVICE_KEY="$(jq -er '.SERVICE_ROLE_KEY | select(length > 0)' <<< "$status")"
          export WP5_IDENTITY_IT_ANON_KEY WP5_IDENTITY_IT_SERVICE_KEY
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2678/assignment-keys.postgrest.acceptance.test.ts
      - name: Verify the worker record through PostgREST
        shell: bash
        env:
          WP5_IDENTITY_IT_URL: http://127.0.0.1:54321
          WP5_IDENTITY_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status="$(bun run supabase -- status -o json)"
          WP5_IDENTITY_IT_ANON_KEY="$(jq -er '.ANON_KEY | select(length > 0)' <<< "$status")"
          WP5_IDENTITY_IT_SERVICE_KEY="$(jq -er '.SERVICE_ROLE_KEY | select(length > 0)' <<< "$status")"
          export WP5_IDENTITY_IT_ANON_KEY WP5_IDENTITY_IT_SERVICE_KEY
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2678/worker-record.postgrest.acceptance.test.ts
      - name: Verify a signed-in person's own donor through account link and Party
        shell: bash
        env:
          WP5_IDENTITY_IT_URL: http://127.0.0.1:54321
          WP5_IDENTITY_IT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status="$(bun run supabase -- status -o json)"
          WP5_IDENTITY_IT_ANON_KEY="$(jq -er '.ANON_KEY | select(length > 0)' <<< "$status")"
