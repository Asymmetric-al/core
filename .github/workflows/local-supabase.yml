name: Local Supabase Stack

# Starts a local Supabase stack from source, then runs the Supabase Auth email
# round trips and missionary handler authority proof against it (docs/ci.md, "Local Supabase
# stack workflow"):
#
# - The migration chain and the seed on the real Supabase image. This is the
#   only job that applies them there, with Supabase's roles and grants and a
#   `postgres` that is not a superuser; every other job uses plain Postgres as
#   a superuser, which hid two stage 1 migrations that the real image refuses
#   (council round 2). So every pull request that changes the chain, the seed,
#   the stack's configuration or the CLI pin starts the stack.
# - The email round trips of WP0b and WP1.4: password recovery in all three
#   apps and sign-up confirmation on two hosts of the donor portal, through
#   the stack's Auth server and mail catcher (council round 2, B4).
# - The release job's replay against the platform's image (WP1.6). The release
#   job fingerprints a replay of the chain on plain Postgres, made with hosted
#   Supabase's default privileges (scripts/sql/hosted-default-privileges.sql),
#   and stops when a hosted database differs from it. The stack runs
#   Supabase's own image, so the same replay must fingerprint exactly as the
#   stack does. This job runs only when a listed path changes, and it compares
#   with the image the pinned CLI starts, not with hosted: a change of the
#   defaults on hosted is caught by the release's gates.
#
# Its own workflow, so that no frozen suite of ci.yml or ci-integration.yml
# changes. Not a required check.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/local-supabase.yml
      # The chain, the seed, the stack's configuration and the CLI pin.
      - supabase/migrations/**
      - supabase/seed.sql
      - supabase/config.toml
      - scripts/supabase-cli.mjs
      # The release job's replay and its fingerprint (WP1.6).
      - scripts/sql/hosted-default-privileges.sql
      - scripts/sql/supabase-compat-bootstrap.sql
      - scripts/verify/supabase-migrations.mjs
      - scripts/release/schema-fingerprint.mjs
      # The auth screens, packages, routes and proxies the round trips cover.
      - packages/ui/components/auth/**
      - packages/auth/**
      - packages/api/src/auth/**
      - apps/*/proxy.ts
      - apps/missionary/lib/route-policy.ts
      - apps/*/app/(auth)/**
      - apps/*/app/auth/**
      - apps/missionary/app/forgot-password/**
      - apps/missionary/app/register/**
      # The missionary RPC arguments, embedded rows, writes and their route proof.
      - packages/api/src/missionary-portal/**
      - packages/api/src/follower-requests/**
      - packages/api/src/missionaries/**
      - packages/api/src/profile/**
      - packages/api/src/shared/api-http-error.ts
      - packages/api/src/shared/http-errors.ts
      - packages/api/src/shared/missionary-authority.ts
      - packages/api/src/shared/queries.ts
      - packages/api/src/shared/route-uuid.ts
      - packages/api/src/shared/tenant-members.ts
      - packages/api/src/shared/with-operation.ts
      - packages/database/supabase/admin.ts
      - packages/database/supabase/config.ts
      - tests/fixtures/auth-memberships.ts
      - tests/fixtures/missionary-task-patch.ts
      - vitest.config.mts
      - vitest.per-importer-alias.mts
      - vitest.pin-workspace-packages.mts
      - tests/unit/acceptance/issue-2675/missionary-handler-authority.postgrest.acceptance.test.ts
      - tests/unit/workflows/local-supabase.test.ts
      # The round trips themselves.
      - playwright.auth-mail.config.ts
      - tests/e2e/auth-password-recovery.spec.ts
      - tests/e2e/auth-signup-confirmation.spec.ts
      - tests/e2e/helpers/auth-mail.ts
      - scripts/e2e/run-auth-mail.mjs

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"
  NODE_VERSION: "24.22.3"

concurrency:
  group: local-supabase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/release_replay
    # The plain Postgres the release job replays on (release.yml); the stack's
    # own database listens on 54322.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: release_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Reject fork pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork PRs need a maintainer to run CI"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun ci --no-cache --backend=copyfile
      # One pin for the repository: the version scripts/supabase-cli.mjs pins.
      # With it installed, the wrapper runs it rather than its npx fallback.
      - name: Read the pinned Supabase CLI version
        id: supabase-pin
        run: |
          version="$(sed -n 's/^const PINNED_SUPABASE_CLI_VERSION = "\([0-9.]*\)";$/\1/p' scripts/supabase-cli.mjs)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ steps.supabase-pin.outputs.version }}
      # Applies every migration and the seed to a real Supabase stack (roles,
      # Auth, PostgREST, Mailpit), which CI's plain Postgres does not have.
      - name: Start the local Supabase stack
        run: >-
          bun run supabase -- start
          -x studio,edge-runtime,logflare,vector,imgproxy,postgres-meta,supavisor
      # The release job's replay, made as it makes it, must fingerprint exactly
      # as the stack does, before the round trips write to the stack.
      - name: Install PostgreSQL client
        run: bash scripts/github/install-postgresql-client.sh
      - name: Replay every migration on plain Postgres, as the release job does
        env:
          DATABASE_URL: ${{ env.REPLAY_DATABASE_URL }}
        run: node scripts/verify/supabase-migrations.mjs --hosted-defaults
      - name: The replay fingerprints exactly as the stack does
        env:
          STACK_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          node scripts/release/schema-fingerprint.mjs capture --database-url-env REPLAY_DATABASE_URL --out "$RUNNER_TEMP/replay-fingerprint.json"
          node scripts/release/schema-fingerprint.mjs capture --database-url-env STACK_DATABASE_URL --out "$RUNNER_TEMP/stack-fingerprint.json"
          node scripts/release/schema-fingerprint.mjs compare "$RUNNER_TEMP/replay-fingerprint.json" "$RUNNER_TEMP/stack-fingerprint.json"
      - name: Verify missionary handler authority through PostgREST
        shell: bash
        env:
          MISSIONARY_IT_SUPABASE_URL: http://127.0.0.1:54321
          MISSIONARY_IT_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          export MISSIONARY_IT_SERVICE_ROLE_KEY
          MISSIONARY_IT_SERVICE_ROLE_KEY="$(bun run supabase -- status -o json | node -e 'const status = JSON.parse(require("node:fs").readFileSync(0)); if (!status.SERVICE_ROLE_KEY) process.exit(1); process.stdout.write(status.SERVICE_ROLE_KEY)')"
          bunx vitest run --maxWorkers=1 tests/unit/acceptance/issue-2675/missionary-handler-authority.postgrest.acceptance.test.ts
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run the auth email round trips
        timeout-minutes: 40
        env:
          CI: "1"
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "0"
        run: bun run test:e2e:auth-mail
      - name: Show Auth logs on failure
        if: failure()
        run: docker logs --tail 200 "$(docker ps --filter name=supabase_auth_ --format '{{.Names}}' | head -n 1)" || true
      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-supabase-results
          path: test-results/auth-mail/
          retention-days: 7
