name: Local Supabase Stack

# These checks share a local Supabase stack (docs/ci.md, "Local Supabase stack workflow").
#
# - The migration chain and the seed on the real Supabase image. This is the
#   only job that applies them there, with Supabase's roles and grants and a
#   `postgres` that is not a superuser; every other job uses plain Postgres as
#   a superuser, which hid two stage 1 migrations that the real image refuses
#   (council round 2). So every pull request that changes the chain, the seed,
#   the stack's configuration or the CLI pin starts the stack.
# - Missionary handler authority through PostgREST, with release policies in force.
# - Identity keys through PostgREST (AL-2678): the running build's task embed
#   and own-row reads on the new keys, the worker safety room and the claim.
# - Mission Control CRM reads and exports with real staff sessions, including
#   the browser journeys that read those rows and retain the selected tenant.
# - The email round trips of WP0b and WP1.4: password recovery in all three
#   apps and sign-up confirmation on two hosts of the donor portal, through
#   the stack's Auth server and mail catcher (council round 2, B4).
# - The platform operators' second factor (AL-2675, WP2c): TOTP enrolment and
#   the challenge through the stack's Auth server, the shared operator check
#   through its Data API, and the operator script against its database. CI's
#   `migrate` job has no Auth server, so this is where it runs.
# - The release job's replay against the platform's image (WP1.6). The release
#   job fingerprints a replay of the chain on plain Postgres, made with hosted
#   Supabase's default privileges (scripts/sql/hosted-default-privileges.sql),
#   and stops when a hosted database differs from it. The stack runs
#   Supabase's own image, so the same replay must fingerprint exactly as the
#   stack does. This job runs only when a listed path changes, and it compares
#   with the image the pinned CLI starts, not with hosted: a change of the
#   defaults on hosted is caught by the release's gates.
#
# Its own workflow, so that no frozen suite of ci.yml or ci-integration.yml
# changes. Not a required check.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/local-supabase.yml
      # The chain, the seed, the stack's configuration and the CLI pin.
      - supabase/migrations/**
      - supabase/seed.sql
      - supabase/config.toml
      - scripts/supabase-cli.mjs
      # The release job's replay and its fingerprint (WP1.6).
      - scripts/sql/hosted-default-privileges.sql
      - scripts/sql/supabase-compat-bootstrap.sql
      - scripts/verify/supabase-migrations.mjs
      - scripts/verify/tenant-rls-catalog.mjs
      - docs/security/*.json
      - scripts/release/schema-fingerprint.mjs
      # The auth screens, packages, routes and proxies the round trips cover.
      - packages/ui/components/auth/**
      - packages/auth/**
      - packages/api/src/auth/**
      - apps/*/proxy.ts
      - apps/missionary/lib/route-policy.ts
      - apps/*/app/(auth)/**
      - apps/*/app/auth/**
      - apps/missionary/app/forgot-password/**
      - apps/missionary/app/register/**
      # The chooser the two-organization journey walks (AL-2675; Mission
      # Control's lives in (auth), above).
      - apps/missionary/app/choose-organization/**
      # The missionary RPC arguments, embedded rows, writes and their route proof.
      - packages/api/src/missionary-portal/**
