      - name: Install Playwright Chromium
        id: chromium
        run: bunx playwright install --with-deps chromium
      - name: Run the auth email round trips
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && steps.chromium.outcome == 'success' }}
        timeout-minutes: 40
        env:
          CI: "1"
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "0"
        run: bun run test:e2e:auth-mail
      # Fails, never skips, when the stack's values are missing.
      - name: Prove the platform operators' second factor (WP2c)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        timeout-minutes: 10
        run: node scripts/e2e/run-operator-mfa.mjs
      - name: Prove operator admin invitation second factor (WP3c)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        env:
          OPERATOR_MFA_REQUIRED: "1"
          OPERATOR_MFA_API_URL: http://127.0.0.1:54321
          OPERATOR_MFA_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
