name: CI Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, production]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"
  NODE_VERSION: "24.22.1"

concurrency:
  group: ci-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrate:
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64", "proxmox"]') }}
    timeout-minutes: 50
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      PAYLOAD_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      PAYLOAD_SECRET: ci-payload-secret
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: asymmetrical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Reject fork pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork PRs need a maintainer to run CI"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun ci --no-cache --backend=copyfile
      - name: Install PostgreSQL client
        run: bash scripts/github/install-postgresql-client.sh
      - name: Apply migrations
        run: node scripts/verify/supabase-migrations.mjs
      - name: Verify disposable Supabase Auth compatibility
        run: psql "$DATABASE_URL" -f tests/integration/supabase/bootstrap-auth-compat-verification.sql -v ON_ERROR_STOP=1
      - name: Apply Payload migrations
        run: bun run cms:migrate
      - name: Verify Payload migration status
        run: bun run cms:migrate:status
      - name: Apply demo seed
        run: psql "$DATABASE_URL" -f supabase/seed.sql -v ON_ERROR_STOP=1
      - name: Verify donation fee replay
        run: psql "$DATABASE_URL" -f tests/integration/supabase/donation-fee-replay-verification.sql -v ON_ERROR_STOP=1
      - name: Verify seed counts
        run: |
          profile_count=$(psql "$DATABASE_URL" -t -A -c "SELECT COUNT(*) FROM public.profiles;" | tr -d '[:space:]')
          if [ "$profile_count" != "1" ]; then
            echo "Expected public.profiles count to be 1 after seeding, got: $profile_count"
            exit 1
          fi
          echo "Verified public.profiles seeded row count: $profile_count"
      - name: Verify document-cutover reader role (real stack)
        env:
          DOCUMENT_CUTOVER_IT_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bun x vitest run tests/unit/acceptance/issue-2067/reader-role.integration.acceptance.test.ts
      - name: Verify identity email normalizer and donor keys (real stack)
        run: bun x vitest run tests/unit/acceptance/issue-2254/identity.realstack.acceptance.test.ts
      - name: Verify tenant isolation (real stack)
        env:
          TENANT_GUARD_IT_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bun x vitest run tests/unit/acceptance/issue-2250/tenant-guard.realstack.acceptance.test.ts tests/unit/acceptance/issue-2269/donations-embed.realstack.acceptance.test.ts tests/unit/acceptance/issue-2256/person-anchor.realstack.acceptance.test.ts tests/unit/acceptance/issue-2260/donor-feed-preferences.realstack.acceptance.test.ts tests/unit/acceptance/issue-2312/public-reads.realstack.acceptance.test.ts
      - name: Verify authz EXECUTE grants (real stack)
        env:
          TENANT_GUARD_IT_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bun x vitest run tests/unit/acceptance/issue-2270/authz-execute-grants.realstack.acceptance.test.ts
      - name: Verify tenant table RLS posture (real stack)
        env:
          TENANT_GUARD_IT_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bun x vitest run tests/unit/acceptance/issue-2251/rls-posture.realstack.acceptance.test.ts
      - name: Verify claim tables (real stack)
        env:
          TENANT_GUARD_IT_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bun x vitest run tests/unit/acceptance/issue-2255/claim-tables.realstack.acceptance.test.ts
      - name: Verify donor spine composite FKs (real stack)
        env:
          TENANT_GUARD_IT_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bun x vitest run tests/unit/acceptance/issue-2252/donor-spine-fk.realstack.acceptance.test.ts
      - name: Verify RLS catalog gate (real stack)
        env:
          TENANT_GUARD_IT_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bun x vitest run tests/unit/acceptance/issue-2253/rls-catalog-gate.realstack.acceptance.test.ts

  smoke:
    needs: migrate
    if: >-
      always() &&
      (needs.migrate.result == 'success' ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64", "proxmox"]') }}
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: asymmetrical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
      ASYM_E2E_REQUIRE_HERMETIC_SUPABASE: "1"
    steps:
      - name: Reject fork pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork PRs need a maintainer to run CI"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun ci --no-cache --backend=copyfile
      - name: Start donor app
        run: bash scripts/github/e2e-dev-server.sh donor start 3005
      - name: Wait for health endpoint
        run: bash scripts/github/e2e-dev-server.sh donor wait 3005
      - name: Assert health response shape
        run: |
          response=$(curl -sf http://127.0.0.1:3005/api/health)
          echo "$response" | grep -q '"status":"ok"'

  test-e2e-smoke:
    needs: smoke
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, proxmox]
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: asymmetrical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      PAYLOAD_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      PAYLOAD_SECRET: ci-payload-secret
      SKIP_ENV_VALIDATION: "1"
      # Zero-config bypass: the example.supabase.co placeholder is a
      # non-confidential datasource, so no E2E_AUTH_SECRET /
      # E2E_AUTH_ALLOWED_SUPABASE_REFS is needed (built-in fallback key +
      # implicit allowlist). A real Supabase project would require both.
      E2E_AUTH_BYPASS: "true"
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3005"
      PLAYWRIGHT_REUSE_EXISTING_SERVER: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
      ASYM_E2E_REQUIRE_HERMETIC_SUPABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install PostgreSQL client
        run: bash scripts/github/install-postgresql-client.sh
      - name: Apply migrations
        run: node scripts/verify/supabase-migrations.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun ci --no-cache --backend=copyfile
      - name: Apply Payload migrations
        run: bun run cms:migrate
      - name: Verify Payload migration status
        run: bun run cms:migrate:status
      - name: Apply demo seed
        run: psql "$DATABASE_URL" -f supabase/seed.sql -v ON_ERROR_STOP=1
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start donor app
        run: bash scripts/github/e2e-dev-server.sh donor start 3005
      - name: Wait for donor health endpoint
        run: >-
          bash scripts/github/e2e-dev-server.sh donor wait 3005 127.0.0.1
          /api/health /api/auth/demo-account
      - name: Start admin app
        run: bash scripts/github/e2e-dev-server.sh admin start 3030
      - name: Wait for admin health endpoint
        run: bash scripts/github/e2e-dev-server.sh admin wait 3030
      - name: Run Playwright smoke suite
        timeout-minutes: 15
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3005"
          PLAYWRIGHT_ADMIN_BASE_URL: "http://127.0.0.1:3030"
          PLAYWRIGHT_INCLUDE_ADMIN: "1"
        run: bun run test:e2e:smoke
      - name: Show dev server logs on failure
        if: failure()
        run: |
          echo "--- donor dev log (tail) ---"
          tail -n 150 "${RUNNER_TEMP:-/tmp}/donor-dev.log" || true
          echo "--- admin dev log (tail) ---"
          tail -n 150 "${RUNNER_TEMP:-/tmp}/admin-dev.log" || true
      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

  test-e2e:
    needs: [smoke, test-e2e-smoke]
    if: >-
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: ${{ (github.event_name == 'pull_request' && github.base_ref == 'develop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
    runs-on: [self-hosted, linux, x64, proxmox]
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: asymmetrical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      PAYLOAD_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      PAYLOAD_SECRET: ci-payload-secret
      SKIP_ENV_VALIDATION: "1"
      E2E_AUTH_BYPASS: "true"
      # Required secrets for the datasource-bound bypass against the hosted demo project.
      # Non-production PRs switch to the example
      # placeholder before app startup below. Production PRs keep hosted secrets.
      #   E2E_AUTH_SECRET                 — HMAC signing key shared by producer + verifiers
      #   E2E_AUTH_ALLOWED_SUPABASE_REFS  — project ref of the demo Supabase project (never prod)
      E2E_AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET }}
      E2E_AUTH_ALLOWED_SUPABASE_REFS: ${{ secrets.E2E_AUTH_ALLOWED_SUPABASE_REFS }}
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3005"
      PLAYWRIGHT_ADMIN_BASE_URL: "http://127.0.0.1:3030"
      PLAYWRIGHT_INCLUDE_ADMIN: "1"
      PLAYWRIGHT_REUSE_EXISTING_SERVER: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
      DEMO_MISSIONARY_EMAIL: ${{ secrets.DEMO_MISSIONARY_EMAIL }}
      DEMO_DONOR_EMAIL: ${{ secrets.DEMO_DONOR_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install PostgreSQL client
        run: bash scripts/github/install-postgresql-client.sh
      - name: Apply migrations
        run: node scripts/verify/supabase-migrations.mjs
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun ci --no-cache --backend=copyfile
      - name: Apply Payload migrations
        run: bun run cms:migrate
      - name: Verify Payload migration status
        run: bun run cms:migrate:status
      - name: Apply demo seed
        run: psql "$DATABASE_URL" -f supabase/seed.sql -v ON_ERROR_STOP=1
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Use placeholder Supabase for non-production E2E
        if: >-
          (github.event_name == 'pull_request' && github.base_ref != 'production') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/production')
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=example-anon-key" >> "$GITHUB_ENV"
          echo "ASYM_E2E_REQUIRE_HERMETIC_SUPABASE=1" >> "$GITHUB_ENV"
      - name: Start donor app
        run: bash scripts/github/e2e-dev-server.sh donor start 3005
      - name: Wait for donor health endpoint
        run: bash scripts/github/e2e-dev-server.sh donor wait 3005
      - name: Start admin app
        run: bash scripts/github/e2e-dev-server.sh admin start 3030
      - name: Wait for admin health endpoint
        run: bash scripts/github/e2e-dev-server.sh admin wait 3030
      - name: Demo auth preflight
        env:
          PLAYWRIGHT_REPORT_DIR: "playwright-report/auth-preflight"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3005"
        run: bun run test:e2e:auth-preflight
      - name: Run Playwright production gate
        timeout-minutes: 10
        env:
          PLAYWRIGHT_REPORT_DIR: "playwright-report/production-gate"
          CI: "1"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3005"
        run: bun run test:e2e:production-gate
      - name: Boneyard smoke (admin app)
        timeout-minutes: 5
        env:
          CI: "1"
          PLAYWRIGHT_BONEYARD_TARGET: "admin"
        run: bun run test:e2e:boneyard:admin
      - name: Start missionary app
        run: bash scripts/github/e2e-dev-server.sh missionary start 4000
      - name: Wait for missionary health endpoint
        run: bash scripts/github/e2e-dev-server.sh missionary wait 4000
      - name: Boneyard smoke (missionary app)
        timeout-minutes: 5
        env:
          CI: "1"
          PLAYWRIGHT_BONEYARD_TARGET: "missionary"
          PLAYWRIGHT_MISSIONARY_BASE_URL: "http://127.0.0.1:4000"
        run: bun run test:e2e:boneyard:missionary
      - name: Boneyard smoke (donor app)
        timeout-minutes: 5
        env:
          CI: "1"
          PLAYWRIGHT_BONEYARD_TARGET: "donor"
          PLAYWRIGHT_DONOR_BASE_URL: "http://127.0.0.1:3005"
        run: bun run test:e2e:boneyard:donor
      - name: Run Playwright CMS E2E
        timeout-minutes: 10
        env:
          PLAYWRIGHT_REPORT_DIR: "playwright-report/cms"
          CI: "1"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3005"
          PLAYWRIGHT_INCLUDE_ADMIN: "1"
        run: bun run test:e2e:cms --project=chromium
      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-smoke-gate:
    if: always()
    needs: [migrate, smoke, test-e2e-smoke]
    runs-on: ubuntu-slim
    steps:
      - name: Fail if E2E smoke failed
        run: |
          echo "migrate: ${{ needs.migrate.result }}"
          echo "smoke: ${{ needs.smoke.result }}"
          echo "test-e2e-smoke: ${{ needs['test-e2e-smoke'].result }}"

          # Every skip fails closed. Blame the first non-success in dependency
          # order so an upstream failure is not reported as an E2E failure.
          if [ "${{ needs.migrate.result }}" != "success" ]; then
            echo "Root cause: migrate (${{ needs.migrate.result }})"
            echo "E2E smoke gate failed."
            exit 1
          fi
          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "Root cause: smoke (${{ needs.smoke.result }})"
            echo "E2E smoke gate failed."
            exit 1
          fi
          if [ "${{ needs['test-e2e-smoke'].result }}" != "success" ]; then
            echo "Root cause: test-e2e-smoke (${{ needs['test-e2e-smoke'].result }})"
            echo "E2E smoke gate failed."
            exit 1
          fi

  # Instant Navigation guards (Next.js 16.3). These only produce a trustworthy
  # verdict against a PRODUCTION build with the testing API exposed — `next dev`
  # neither prefetches nor locks reliably — so this job builds and starts donor
  # rather than reusing the dev servers the other e2e jobs run. See
  # instant-nav.rig.md.
  instant-nav:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.base_ref == 'production') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/production')) &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: ${{ (github.event_name == 'pull_request' && github.base_ref == 'develop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
    runs-on: [self-hosted, linux, x64, proxmox]
    timeout-minutes: 25
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
      # Double-gated so real Vercel production builds never expose the API.
      VERCEL_ENV: preview
      EXPOSE_TESTING_API: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci --no-cache --backend=copyfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build donor with the testing API exposed
        run: bun run build:donor
      - name: Start donor production server
        run: |
          nohup node scripts/run-with-ci-env.mjs -- bun run --cwd apps/donor start -- --port 3006 --hostname 127.0.0.1 > /tmp/donor-prod.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:3006/api/playwright-ready >/dev/null; then
              echo "donor production server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for the donor production server"
          tail -n 100 /tmp/donor-prod.log || true
          exit 1
      - name: Instant navigation guards
        env:
          INSTANT_NAV_RIG: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3006
          # Without these, playwright.config.ts still defines a webServer under
          # CI and spawns `next dev` — colliding on 3006 and measuring a dev
          # server, the exact vacuous verdict the rig exists to prevent.
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "1"
          PLAYWRIGHT_INCLUDE_ADMIN: "0"
        run: node scripts/run-with-ci-env.mjs -- node node_modules/@playwright/test/cli.js test tests/e2e/instant-navigation.spec.ts --project=chromium --retries=0
      - name: Upload instant-nav report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-instant-nav-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  integration-gate:
    if: always()
    needs: [migrate, smoke, e2e-smoke-gate]
    runs-on: ubuntu-slim
    steps:
      - name: Fail if integration prerequisites failed
        run: |
          echo "migrate: ${{ needs.migrate.result }}"
          echo "smoke: ${{ needs.smoke.result }}"
          echo "e2e-smoke-gate: ${{ needs['e2e-smoke-gate'].result }}"

          failed=0
          for result in \
            "${{ needs.migrate.result }}" \
            "${{ needs.smoke.result }}" \
            "${{ needs['e2e-smoke-gate'].result }}"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          # Blame the first non-success in dependency order.
          if [ "$failed" -ne 0 ]; then
            if [ "${{ needs.migrate.result }}" != "success" ]; then
              echo "Root cause: migrate (${{ needs.migrate.result }})"
              echo "Integration gate failed."
              exit 1
            fi
            if [ "${{ needs.smoke.result }}" != "success" ]; then
              echo "Root cause: smoke (${{ needs.smoke.result }})"
              echo "Integration gate failed."
              exit 1
            fi
            echo "Root cause: e2e-smoke-gate (${{ needs['e2e-smoke-gate'].result }}); see its own Root cause line"
            echo "Integration gate failed."
            exit 1
          fi

  e2e-gate:
    if: >
      always() && (
        (github.event_name == 'pull_request' && github.base_ref == 'production') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/production')
      )
    needs: [test-e2e, instant-nav]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if E2E failed on production
        run: |
          echo "test-e2e: ${{ needs['test-e2e'].result }}"
          echo "instant-nav: ${{ needs['instant-nav'].result }}"

          if [ "${{ needs['test-e2e'].result }}" != "success" ] || \
             [ "${{ needs['instant-nav'].result }}" != "success" ]; then
            echo "E2E gate failed."
            exit 1
          fi
