name: CI Integration

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asymmetrical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/asymmetrical_test" >> $GITHUB_ENV
      - name: Apply migrations
        run: |
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            psql "$DATABASE_URL" -f "$f" -v ON_ERROR_STOP=1
          done
      - name: Apply demo seed
        run: psql "$DATABASE_URL" -f supabase/seed.sql -v ON_ERROR_STOP=1
      - name: Verify seed counts
        run: |
          profile_count=$(psql "$DATABASE_URL" -t -A -c "SELECT COUNT(*) FROM public.profiles;" | tr -d '[:space:]')
          if [ "$profile_count" != "1" ]; then
            echo "Expected public.profiles count to be 1 after seeding, got: $profile_count"
            exit 1
          fi
          echo "Verified public.profiles seeded row count: $profile_count"

  smoke:
    needs: migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asymmetrical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start donor app
        run: bun --bun next dev apps/donor -p 3005 &
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3005/api/health >/dev/null; then
              exit 0
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for health endpoint"
              exit 1
            fi
            sleep 1
          done
      - name: Assert health response shape
        run: |
          response=$(curl -sf http://127.0.0.1:3005/api/health)
          echo "$response" | grep -q '"status":"ok"'

  test-e2e:
    needs: smoke
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asymmetrical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asymmetrical_test
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: |
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            psql "$DATABASE_URL" -f "$f" -v ON_ERROR_STOP=1
          done
      - name: Apply demo seed
        run: psql "$DATABASE_URL" -f supabase/seed.sql -v ON_ERROR_STOP=1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start donor app
        run: bun --bun next dev apps/donor -p 3005 &
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3005/api/health >/dev/null; then
              exit 0
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for health endpoint"
              exit 1
            fi
            sleep 1
          done
      - name: Run Playwright E2E
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3005"
        run: bunx playwright test --project=chromium
      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
