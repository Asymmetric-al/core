name: Auto-rebase PR conflicting with develop

# Dispatched by the merge coordinator (scripts/github/merge-coordinator.mjs) when an open
# develop PR's mergeable_state is "dirty" (it conflicts with develop). It merges develop into
# the PR's OWN branch and has a headless cursor-agent resolve ONLY the conflicted regions, then
# pushes. The push re-triggers CI + the Tier-1 review bots + the planner, and the coordinator
# re-evaluates — so nothing merges without a fresh review of the resolved code.
#
# Guard rails: a size cap (large conflicts escalate to needs-human instead of auto-resolving),
# a 2-round cap, and an abort-on-unresolved fallback. Dispatch-only; must live on the repo
# default branch (production) to be dispatchable.
#
# Secrets required:
#   PIPELINE_PAT   — fine-grained PAT (contents:write, pull-requests:write) for the
#                    II-ricky-bobby-II identity. Used for checkout + push so the merge commit
#                    re-triggers CI/reviews (GITHUB_TOKEN pushes do NOT re-trigger workflows).
#   CURSOR_API_KEY — from Cursor → Settings → API keys (headless agent auth).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to rebase"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-rebase-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        run: echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT }}

      - name: Eligibility + size + round cap
        id: guard
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node scripts/github/pr-rebase-guard.mjs

      - name: Check out the PR branch
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
        run: gh pr checkout ${{ steps.pr.outputs.number }} --repo ${{ github.repository }}

      - name: Merge develop into the PR branch
        id: merge
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "Blake"
          git config user.email "116130409+II-ricky-bobby-II@users.noreply.github.com"
          git fetch origin develop
          set +e
          git merge --no-edit origin/develop
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Cursor CLI
        if: steps.guard.outputs.proceed == 'true' && steps.merge.outputs.conflict == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve conflicts (headless cursor-agent)
        if: steps.guard.outputs.proceed == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          cursor-agent -p "You are resolving merge conflicts on PR #$PR in Asymmetric-al/core. The 'develop' branch was just merged into this PR's branch and Git conflicts remain. Resolve ONLY the conflicted regions (the <<<<<<< ======= >>>>>>> markers), preserving the intent of BOTH sides. Never weaken, skip, or delete tests; never edit files under .github/workflows; never touch files that are not part of a conflict; never push to production. If any conflict is ambiguous, architectural, or you are not confident, STOP and leave it unresolved rather than guessing. Do NOT commit or push — the workflow handles that." --model gpt-5.5 --force --print

      - name: Commit & push (or abort if unresolved)
        if: steps.guard.outputs.proceed == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # Any remaining unmerged paths or conflict markers => the agent could not safely resolve.
          unmerged="$(git diff --name-only --diff-filter=U)"
          markers="$(git grep -n -e '^<<<<<<< ' -e '^>>>>>>> ' -- . ':(exclude).github/**' || true)"
          if [ -n "$unmerged" ] || [ -n "$markers" ]; then
            echo "Unresolved conflicts remain — aborting the merge."
            git merge --abort || true
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "⚠️ Auto-rebase could not fully resolve the conflict with develop. Labeling \`needs-human\`."
            gh issue edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human,automation:auto-escalated
            exit 0
          fi
          git add -A
          git commit --no-edit -m "chore: merge develop & resolve conflicts [rebase round ${{ steps.guard.outputs.round }}]" || true
          git push

      - name: Push clean merge (no conflicts)
        if: steps.guard.outputs.proceed == 'true' && steps.merge.outputs.conflict == 'false'
        run: git push
