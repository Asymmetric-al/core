name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - production
      - "cursor/**"
  push:
    branches: [develop, production]

permissions:
  contents: read
  pull-requests: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Verify Git attribution
        env:
          GH_TOKEN: ${{ github.token }}
          ASYM_GITHUB_EVENT_NAME: ${{ github.event_name }}
          ASYM_GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ASYM_GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ASYM_GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ASYM_GITHUB_REPOSITORY: ${{ github.repository }}
          ASYM_GITHUB_REF_NAME: ${{ github.ref_name }}
          ASYM_GITHUB_REF_TYPE: ${{ github.ref_type }}
          ASYM_GITHUB_EVENT_ACTOR_LOGIN: ${{ github.actor }}
          ASYM_GITHUB_EVENT_ACTOR_ID: ${{ github.actor_id }}
          ASYM_GITHUB_EVENT_SENDER_LOGIN: ${{ github.event.sender.login || '' }}
          ASYM_GITHUB_EVENT_SENDER_ID: ${{ github.event.sender.id || '' }}
          ASYM_GITHUB_PULL_REQUEST_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login || '' }}
          ASYM_GITHUB_PULL_REQUEST_AUTHOR_ID: ${{ github.event.pull_request.user.id || '' }}
          ASYM_GITHUB_HEAD_OWNER_LOGIN: ${{ github.event.pull_request.head.repo.owner.login || '' }}
          ASYM_GITHUB_HEAD_OWNER_ID: ${{ github.event.pull_request.head.repo.owner.id || '' }}
          ASYM_GITHUB_TRIGGERING_ACTOR_LOGIN: ${{ github.triggering_actor }}
        run: bun run verify:git-attribution -- --ci
      - run: bun run format:check
      - run: bun run skills:verify
      - run: bun run openspec:validate

  lint:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run affected lint on pull requests
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run lint --affected --filter=./apps/* --filter=./packages/* --filter=./tooling/*
      - name: Run full lint on protected branch pushes
        if: github.event_name != 'pull_request'
        run: bun run lint
      - name: Check data access boundary
        run: bun run verify:data-boundary

      - name: CMS public sole-entry check
        run: bun run verify:cms-public-sole-entry
      - run: bun run verify:workspace-contract
      - name: Check bun.lock workspace-manifest drift
        run: bun run verify:bun-lock-drift
      - run: bun run verify:eslint

  typecheck:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run affected typecheck on pull requests
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run typecheck --affected --filter=./apps/* --filter=./packages/* --filter=./tooling/*
      - name: Run full typecheck on protected branch pushes
        if: github.event_name != 'pull_request'
        run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run build

  test-unit:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Required by @asym/env when any test imports packages that load env (e.g. auth context).
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run unit tests
        run: bun run test:unit
      - name: Upload coverage artifact (best effort)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    if: always()
    needs: [format, lint, typecheck, build, test-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any prerequisite check failed
        run: |
          echo "format: ${{ needs.format.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "test-unit: ${{ needs['test-unit'].result }}"

          failed=0
          for result in \
            "${{ needs.format.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs['test-unit'].result }}"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "At least one CI check failed."
            exit 1
          fi
