name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop, production]

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run format:check
      - run: bun run skills:verify

  lint:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run lint
      - name: Check data access boundary
        run: bun run verify:data-boundary
      - run: bun run verify:workspace-contract
      - run: bun run verify:eslint

  typecheck:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run build

  test-unit:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Required by @asym/env when any test imports packages that load env (e.g. auth context).
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run unit tests
        run: bun run test:unit
      - name: Upload coverage artifact (best effort)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    if: always()
    needs: [format, lint, typecheck, build, test-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any prerequisite check failed
        run: |
          echo "format: ${{ needs.format.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "test-unit: ${{ needs['test-unit'].result }}"

          failed=0
          for result in \
            "${{ needs.format.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs['test-unit'].result }}"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "At least one CI check failed."
            exit 1
          fi
