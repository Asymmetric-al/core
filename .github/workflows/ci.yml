name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, production]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

env:
  BUN_VERSION: "1.4.3"
  NODE_VERSION: "24.22.1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compilation-plan:
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.plan.outputs.requested }}
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select compilation checkpoint
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify/ci-build-policy.mjs

  format:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run format:check

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify approved Node runtime
        run: node scripts/verify/node-version.mjs
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run skills:verify
      - run: bun run verify:phase25-spec
      - run: bun run verify:phase27-spec
      - run: bun run verify:phase28-spec
      - run: bun run openspec:validate
      - run: bun run verify:openspec-deltas
      - name: Enforce complete Shadscan app floors and reviewed findings
        run: bun run verify:shadscan -- --output "$RUNNER_TEMP/shadscan"
      - name: Retain raw Shadscan evidence even when its gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadscan-audit
          path: ${{ runner.temp }}/shadscan/
          if-no-files-found: warn
          retention-days: 14
      - name: Check out the Phase 24 proof candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: phase24-proof-head
          fetch-depth: 1
          persist-credentials: false
      - name: Capture Phase 24 repository proof
        env:
          PHASE24_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node phase24-proof-head/scripts/cms/run-local-e2e.mjs --phase24-contract-check --candidate-sha "$PHASE24_CANDIDATE_SHA" > "$RUNNER_TEMP/phase24-authority-manifest.json"
      - name: Upload passing Phase 24 repository proof
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase24-authority-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase24-authority-manifest.json
          if-no-files-found: error
          retention-days: 14

  shadscan-report:
    needs: [integrity]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/shadscan.yml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run affected lint on pull requests
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run lint --affected --filter=./apps/* --filter=./packages/* --filter=./tooling/*
      - name: Run full lint on protected branch pushes
        if: github.event_name != 'pull_request'
        run: bun run lint
      - name: Check data access boundary
        run: bun run verify:data-boundary

      - name: CMS public sole-entry check
        run: bun run verify:cms-public-sole-entry
      - run: bun run verify:workspace-contract
      - name: Check bun.lock workspace-manifest drift
        run: bun run verify:bun-lock-drift
      - run: bun run verify:eslint

  typecheck:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run affected typecheck on pull requests
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run typecheck --affected --filter=./apps/* --filter=./packages/* --filter=./tooling/*
      - name: Run full typecheck on protected branch pushes
        if: github.event_name != 'pull_request'
        run: bun run typecheck

  build:
    needs: compilation-plan
    if: ${{ needs.compilation-plan.outputs.requested == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, proxmox]
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Compile requested apps
        env:
          CI_BUILD_APPS: ${{ needs.compilation-plan.outputs.apps }}
        run: node scripts/verify/ci-build-policy.mjs --build

  test-unit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, proxmox]
    timeout-minutes: 25
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Required by @asym/env when any test imports packages that load env (e.g. auth context).
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run unit tests
        run: bun run test:unit
      - name: Upload coverage artifact (best effort)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  acceptance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Required by @asym/env when any test imports packages that load env (e.g. auth context).
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci --no-cache --backend=copyfile
      - name: Run acceptance tests
        run: bun run test:acceptance

  ci-gate:
    if: always()
    needs:
      [
        compilation-plan,
        format,
        integrity,
        lint,
        typecheck,
        build,
        test-unit,
        acceptance-tests,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate correctness checks and requested compilation
        env:
          CI_BUILD_REQUESTED: ${{ needs.compilation-plan.outputs.requested }}
          CI_RESULTS: >-
            {"plan":"${{ needs.compilation-plan.result }}","format":"${{ needs.format.result }}","integrity":"${{ needs.integrity.result }}","lint":"${{ needs.lint.result }}","typecheck":"${{ needs.typecheck.result }}","unit":"${{ needs.test-unit.result }}","build":"${{ needs.build.result }}","acceptance":"${{ needs.acceptance-tests.result }}"}
        run: node scripts/verify/ci-build-policy.mjs --gate

  ci-gate-comment:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'failure') }}
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post the ci-gate status comment
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          marker='<!-- ci-gate-status -->'
          warn() { echo "::warning::ci-gate-comment: $1"; exit 0; }
          command -v gh >/dev/null || warn "gh is not installed; no comment posted"
          case "$CI_GATE_RESULT" in success | failure) ;; *) warn "unexpected ci-gate result" ;; esac
          head=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha) || warn "could not read the PR head"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::notice::ci-gate-comment: PR head moved from $HEAD_SHA to $head; not commenting"
            exit 0
          fi
          ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id") ||
            warn "could not list PR comments"
          for id in $ids; do
            gh api -X DELETE "repos/$GH_REPO/issues/comments/$id" >/dev/null || warn "could not delete comment $id"
          done
          body=$(printf '%s\nci-gate: %s on %s, run %s\n%s' "$marker" "$CI_GATE_RESULT" "$HEAD_SHA" "$RUN_ID" \
            "$SERVER_URL/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT")
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null || warn "could not post the comment"
