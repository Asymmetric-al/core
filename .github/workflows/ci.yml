name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, production]

permissions:
  contents: read
  pull-requests: read

env:
  BUN_VERSION: "1.4.0"
  NODE_VERSION: "24.15.0"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compilation-plan:
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.plan.outputs.requested }}
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select compilation checkpoint
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify/ci-build-policy.mjs

  format:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run format:check

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci --no-cache --backend=copyfile
      - run: bun run skills:verify
      - run: bun run verify:phase25-spec
      - run: bun run openspec:validate
      - run: bun run verify:openspec-deltas
      - name: Enforce complete Shadscan app floors and reviewed findings
        run: bun run verify:shadscan -- --output "$RUNNER_TEMP/shadscan"
      - name: Retain raw Shadscan evidence even when its gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadscan-audit
          path: ${{ runner.temp }}/shadscan/
          if-no-files-found: warn
          retention-days: 14
      - name: Check out the Phase 24 proof candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: phase24-proof-head
          fetch-depth: 1
          persist-credentials: false
      - name: Capture Phase 24 repository proof
        env:
          PHASE24_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node phase24-proof-head/scripts/cms/run-local-e2e.mjs --phase24-contract-check --candidate-sha "$PHASE24_CANDIDATE_SHA" > "$RUNNER_TEMP/phase24-authority-manifest.json"
      - name: Upload passing Phase 24 repository proof
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase24-authority-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase24-authority-manifest.json
          if-no-files-found: error
          retention-days: 14

  shadscan-report:
    needs: [integrity]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/shadscan.yml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run affected lint on pull requests
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run lint --affected --filter=./apps/* --filter=./packages/* --filter=./tooling/*
      - name: Run full lint on protected branch pushes
        if: github.event_name != 'pull_request'
        run: bun run lint
      - name: Check data access boundary
        run: bun run verify:data-boundary

      - name: CMS public sole-entry check
        run: bun run verify:cms-public-sole-entry
      - run: bun run verify:workspace-contract
      - name: Check bun.lock workspace-manifest drift
        run: bun run verify:bun-lock-drift
      - run: bun run verify:eslint

  typecheck:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run affected typecheck on pull requests
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run typecheck --affected --filter=./apps/* --filter=./packages/* --filter=./tooling/*
      - name: Run full typecheck on protected branch pushes
        if: github.event_name != 'pull_request'
        run: bun run typecheck

  build:
    needs: compilation-plan
    if: needs.compilation-plan.outputs.requested == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Compile requested apps
        env:
          CI_BUILD_APPS: ${{ needs.compilation-plan.outputs.apps }}
        run: node scripts/verify/ci-build-policy.mjs --build

  test-unit:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Required by @asym/env when any test imports packages that load env (e.g. auth context).
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies (canvas)
        run: bash scripts/github/install-canvas-deps.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun ci --no-cache --backend=copyfile
      - name: Run unit tests
        run: bun run test:unit
      - name: Upload coverage artifact (best effort)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    if: always()
    needs:
      [compilation-plan, format, integrity, lint, typecheck, build, test-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate correctness checks and requested compilation
        env:
          CI_BUILD_REQUESTED: ${{ needs.compilation-plan.outputs.requested }}
          CI_RESULTS: >-
            {"plan":"${{ needs.compilation-plan.result }}","format":"${{ needs.format.result }}","integrity":"${{ needs.integrity.result }}","lint":"${{ needs.lint.result }}","typecheck":"${{ needs.typecheck.result }}","unit":"${{ needs.test-unit.result }}","build":"${{ needs.build.result }}"}
        run: node scripts/verify/ci-build-policy.mjs --gate
