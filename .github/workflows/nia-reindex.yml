# Verifies the asymmetric-al/core repository is registered as a Nia source.
# POST /v2/sources/{id}/sync is not supported for GitHub repos (Nia returns 400:
# "Sync is only supported for local folders and Google Drive"). Repo indexing is
# driven by Nia's GitHub integration, not this endpoint.
name: Nia reindex

on:
  push:
    branches:
      - epic
  workflow_dispatch:

jobs:
  reindex:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find Nia source id
        env:
          NIA_API_KEY: ${{ secrets.NIA_API_KEY }}
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error --get \
            'https://apigcp.trynia.ai/v2/sources' \
            -H "Authorization: Bearer ${NIA_API_KEY}" \
            --data-urlencode 'type=repository' \
            --data-urlencode 'query=asymmetric-al/core' \
            --data-urlencode 'limit=100')"

          source_id="$(printf '%s' "$response" | python3 scripts/nia_pick_core_source.py)"

          if [ -z "$source_id" ]; then
            echo "Could not find a Nia source for asymmetric-al/core"
            exit 1
          fi

          echo "SOURCE_ID=$source_id" >> "$GITHUB_ENV"
          echo "Resolved SOURCE_ID=$source_id"

      - name: Repository source registered (GitHub sync is not API-triggerable)
        run: |
          set -euo pipefail
          echo "Nia source for this repo is registered (id=${SOURCE_ID})."
          echo "GitHub repository reindexing is handled by Nia's GitHub connector, not POST /v2/sources/{id}/sync."
