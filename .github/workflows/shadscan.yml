# The single advisory Shadscan scan for each CI event. ci.yml calls it from
# the non-required shadscan-report job; ci-gate does not depend on it, so no
# score, finding or scan failure blocks a merge. A failed installation or scan
# marks the scan failed and publishes "evidence unavailable" from a separate job.
name: Shadscan

on:
  workflow_call:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"
  NODE_VERSION: "24.22.3"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      unavailable-reason: ${{ steps.unavailable.outputs.reason }}
    steps:
      - name: Check out the submitted head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Step limits keep a hung step a failure inside the job's own limit. A
      # job that reaches its limit is cancelled, and a cancelled run
      # publishes nothing.
      - name: Install dependencies
        id: install
        timeout-minutes: 15
        run: |
          bash scripts/github/install-canvas-deps.sh
          bun ci --no-cache --backend=copyfile
      - name: Audit the submitted head
        id: audit
        timeout-minutes: 10
        run: bun run shadscan:audit -- --output "$RUNNER_TEMP/shadscan"
      - name: Retain the raw report and publication summary
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadscan-audit
          path: |
            ${{ runner.temp }}/shadscan/shadscan.raw.json
            ${{ runner.temp }}/shadscan/shadscan.summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Record why evidence is unavailable
        id: unavailable
        if: ${{ failure() && !cancelled() }}
        env:
          # Installation is skipped, not failed, when an earlier setup step fails.
          UNAVAILABLE_REASON: ${{ steps.install.outcome == 'failure' && 'Dependency installation failed' || steps.install.outcome != 'success' && 'A setup step failed before dependency installation' || steps.audit.outcome != 'success' && 'The audit did not produce a valid report' || 'The audit artifact could not be uploaded' }}
        run: printf 'reason=%s\n' "$UNAVAILABLE_REASON" >> "$GITHUB_OUTPUT"

  publish:
    needs: report
    # Superseded and timed-out scans must not replace a newer report.
    if: ${{ !cancelled() && needs.report.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      SHADSCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the publisher
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHADSCAN_HEAD_SHA }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The publisher reads validated JSON outside the checkout. It never
      # installs dependencies or executes files from the scan artifact.
      - name: Download the audit artifact
        id: download
        if: needs.report.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shadscan-audit
          path: ${{ runner.temp }}/shadscan
      - name: Publish the advisory scores
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/shadscan-publish.mjs "$RUNNER_TEMP/shadscan"
      - name: Publish unavailable evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && (needs.report.result != 'success' || steps.download.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHADSCAN_UNAVAILABLE_REASON: ${{ steps.download.outcome == 'failure' && 'The audit artifact could not be downloaded' || needs.report.outputs.unavailable-reason || 'The audit did not produce a valid report' }}
        run: node scripts/shadscan-publish.mjs --unavailable
