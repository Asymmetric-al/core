# CI integrity owns the single locked scan and blocking gate. This reusable
# workflow publishes its exact raw evidence without rescanning or changing scores.
name: Shadscan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the integrity audit
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shadscan-audit
          path: ${{ runner.temp }}/shadscan-report
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Publish raw scores and reviewed classifications
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify/shadscan-publish.mjs "$RUNNER_TEMP/shadscan-report"
      - name: Report unavailable evidence
        if: steps.download.outcome != 'success'
        run: echo "Shadscan evidence is unavailable because integrity did not produce a complete audit; no passing score is implied." >> "$GITHUB_STEP_SUMMARY"
