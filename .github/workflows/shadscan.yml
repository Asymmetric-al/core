# CI integrity owns the single locked scan and blocking gate. This reusable
# workflow publishes its exact raw evidence without rescanning or changing scores.
name: Shadscan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download the integrity audit
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shadscan-audit
          path: ${{ runner.temp }}/shadscan-report
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"
      - name: Publish raw scores and reviewed classifications
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify/shadscan-publish.mjs "$RUNNER_TEMP/shadscan-report"
      - name: Report unavailable evidence
        if: steps.download.outcome != 'success'
        run: echo "Shadscan evidence is unavailable because integrity did not produce a complete audit; no passing score is implied." >> "$GITHUB_STEP_SUMMARY"
