name: Autofix PR from Safe-Fix Plan

# When the Final Merge Gate requests changes, run a headless Cursor cloud agent that
# implements the blocking items from the "Simple Safe-Fix Plan" comment and commits them
# to the PR's OWN branch (best practice — keeps the PR one reviewable unit). The push
# re-triggers CI + the Tier-1 review bots + the gate, which re-approves the fixed head;
# the auto-merge workflow then lands it. Bounded by a 3-round cap.
#
# Secrets required:
#   PIPELINE_PAT   — fine-grained PAT (contents:write, pull-requests:write) for the
#                    II-ricky-bobby-II identity. Used for checkout + push so the fix commit
#                    re-triggers CI/reviews (GITHUB_TOKEN pushes do NOT re-trigger workflows).
#   CURSOR_API_KEY — from Cursor → Settings → API keys (headless agent auth).

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to fix"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.event.review.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  autofix:
    # Only on a changes-requested review (the gate) or a manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        run: echo "number=${{ github.event.review.pull_request.number || github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT }}

      - name: Eligibility + round cap
        id: guard
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node scripts/github/autofix-guard.mjs

      - name: Check out the PR branch
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
        run: gh pr checkout ${{ steps.pr.outputs.number }} --repo ${{ github.repository }}

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.proceed == 'true'
        with:
          bun-version: "1.3.14"

      - name: Install Cursor CLI
        if: steps.guard.outputs.proceed == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply the Safe-Fix Plan (headless cursor-agent)
        if: steps.guard.outputs.proceed == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          PLAN="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[] | select(.body|test("Simple Safe-Fix Plan"))] | last | .body')"
          cursor-agent -p "You are fixing PR #$PR in Asymmetric-al/core, already checked out on its own branch. Implement ONLY the BLOCKING items from the Safe-Fix Plan below. Do not widen scope, do not refactor unrelated code, never weaken or delete tests, never edit .github/workflows, never push to production. Make the smallest safe edits. Do NOT commit or push — the workflow commits. If a blocking item is ambiguous or architectural, leave it and note it. SAFE-FIX PLAN:\n\n$PLAN" --model gpt-5.5 --force --print

      - name: Commit & push the fix
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "Blake"
          git config user.email "116130409+II-ricky-bobby-II@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Autofix produced no changes."
          else
            git commit -m "fix: apply Safe-Fix Plan [autofix round ${{ steps.guard.outputs.round }}]"
            git push
          fi
