schema: spec-driven

context: |
  Asymmetric.al/core is a Bun and Turborepo monorepo for Mission Control,
  donor, missionary, and public-site experiences.

  Asym Postgres owns application and CRM truth. Twenty CRM is retired and
  must not be reintroduced as a product dependency.

  OpenSpec uses two layers:
  - platform-* specs govern durable product direction, boundaries, and priorities;
  - capability specs govern accepted verifiable behavior.
  Active changes describe proposed deltas and do not prove that behavior shipped.

  AGENTS.md is the always-on coding-agent router. Canonical skills live under
  docs/ai/skills and are mirrored by the repository skill workflow.

  Substantive behavior changes use TDD. UI work preserves the shared shadcn/Base
  UI system and exact base-maia style.

  Use installed package docs and repository evidence for version and runtime
  facts. Surface material source-of-truth conflicts rather than guessing.

rules:
  proposal:
    - State one clear intent, scope, non-goals, affected capabilities, and rollback.
    - Read relevant current specs, active changes, and accepted ADRs first.
    - Surface authority contradictions before implementation.

  specs:
    - Describe observable durable behavior, not implementation.
    - Preserve all still-valid scenarios in a MODIFIED requirement.
    - Cover tenant, Legal Entity, role, authorization, privacy, money, recovery,
      accessibility, and failure behavior when relevant.

  design:
    - Identify affected apps, packages, APIs, jobs, stores, providers, and routes.
    - Record data ownership, security boundaries, compatibility, migration,
      validation, and rollback.

  tasks:
    - Use unique hierarchical task IDs.
    - Include TDD, focused tests, applicable repository checks, migration proof,
      operational verification, and rollback evidence.
    - Never mark work complete without evidence.

operations:
  apply:
    guidance:
      - Use an explicit change ID and re-read current artifacts from disk.
      - Surface out-of-scope work before implementing it.
      - Update artifacts when implementation discoveries materially change the plan.
      - Use TDD for behavioral changes and focused tests before broad checks.
      - Invoke the Core Guardian for material product, data, tenant, authorization,
        financial, publication, or communication changes.

  archive:
    guidance:
      - Archive only after implementation has become accepted repository reality.
      - Require complete applicable tasks, strict validation, OpenSpec verification,
        applicable Core checks, and no unresolved critical findings.
      - Record accepted warnings and follow-up work honestly.

githubCopilot:
  cloudAgent: false
